<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>期货</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' dshzoo:">
<style>
  :root {
    --paper: #f7f3e8;
    --card: #fffdf6;
    --ink: #2b2b2b;
    --muted: #7a7466;
    --line: #2b2b2b;
    --soft: #ded6c4;
    --up: #b3352b;
    --down: #2f6b45;
    --danger: #c0392b;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    width: 760px; height: 700px; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font: 13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  /* 窗口是无边框的（main.js 里 frame:false + transparent:true），所以这圈画出来的边框
     就是它唯一的「窗框」——和盘口窗同一套手绘圆角，悬空的白板会让人以为程序没画完。 */
  #app {
    display: grid; height: 100%;
    grid-template-rows: 52px auto minmax(0, 1fr) auto 220px;
    grid-template-columns: minmax(0, 1fr);
    overflow: hidden;
    border: 2px solid var(--line);
    border-radius: 20px 18px 22px 16px;
    background: var(--paper);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
  }
  .modebar {
    display: flex; align-items: center; gap: 10px; padding: 4px 14px;
    border-bottom: 1px solid var(--soft); background: var(--card); font-size: 12px;
  }
  .modebar .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
    font-weight: 600; letter-spacing: .04em;
  }
  .modebar .chip.shadow { background: #fdf1c8; }
  .modebar .chip.live { background: #d9ead3; }
  .modebar .chip.off { background: #eee; color: var(--muted); }
  .modebar .modeText { color: var(--muted); }
  .modebar .caps { color: var(--muted); }
  .modebar .pending { color: var(--danger); }
  .modebar .pauseText { color: var(--muted); }
  .modebar[hidden] { display: none; }
  .modebar .grow { flex: 1; }
  .modebar .hostOnly { display: flex; align-items: center; gap: 6px; }
  .modebar .hostOnly select { padding: 2px 4px; }
  /* 1.10.0：账户档位切换按钮（谁都点得动，房主关市时禁用）。 */
  .modebar .accountBtn {
    border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink);
    border-radius: 999px; padding: 1px 9px; cursor: pointer; font: inherit; font-weight: 600;
  }
  .modebar .accountBtn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .modebar .accountBtn:disabled { opacity: .45; cursor: default; }
  .modebar .hostOnly button, .dangerBtn {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: var(--radius); padding: 2px 8px; cursor: pointer; font: inherit;
  }
  .dangerBtn { border-color: var(--danger); color: var(--danger); }
  header {
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-bottom: 2px solid var(--line); background: var(--card);
    /* 无边框窗口没有系统标题栏：整条顶栏就是拖动区，里面的控件要单独排除，
       否则点「×」会变成拖窗口（和盘口窗同一条规则）。 */
    -webkit-app-region: drag;
  }
  header button, header select, header input, header textarea { -webkit-app-region: no-drag; }
  .winClose {
    flex: none; width: 26px; height: 26px; padding: 0; margin-left: 2px;
    display: grid; place-items: center;
    border: 2px solid var(--line); border-radius: 50% 46% 52% 48%;
    background: transparent; color: var(--ink);
    font: 600 15px/1 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    cursor: pointer;
  }
  .winClose:hover { background: var(--ink); color: var(--paper); }
  header .brand { font-weight: 700; letter-spacing: .06em; }
  header .week { color: var(--muted); }
  header .count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  header .count b { color: var(--ink); font-size: 15px; }
  .stats { display: flex; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 600; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  section { min-height: 0; overflow: hidden; }
  .quotes { overflow: auto; border-bottom: 2px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--paper); color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--soft); }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover { background: #efe9d8; }
  tbody tr.closed td { color: var(--muted); }
  tbody tr.danger { background: #f7ded9; }
  .order { border-bottom: 2px solid var(--line); background: var(--card); padding: 8px 14px; }
  .order .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .order .row + .row { margin-top: 6px; }
  .session { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .delivery {
    padding: 6px 14px; background: #fdf1c8; border-bottom: 1px solid var(--soft);
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--ink); padding: 4px 10px; cursor: pointer; font: inherit;
  }
  .seg button + button { border-left: 1px solid var(--soft); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  select, input[type=number] {
    font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 6px;
  }
  input[type=number] { width: 84px; text-align: right; }
  .preview { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .preview b { color: var(--ink); font-weight: 600; }
  .preview .bad { color: var(--danger); }
  #submit {
    margin-left: auto; padding: 5px 16px; border-radius: var(--radius); cursor: pointer; font: inherit;
    border: 1px solid var(--line); background: var(--ink); color: var(--paper);
  }
  #submit:disabled { opacity: .35; cursor: not-allowed; }
  #withdraw {
    padding: 5px 12px; border-radius: var(--radius); cursor: pointer; font: inherit;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  /* 底部两行：持仓通栏一行，挂单与成交各占半行——760 宽挤三栏时挂单表必然横向溢出。 */
  .bottom {
    display: grid; border-top: 0;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }
  .bottom > section:first-child { grid-column: 1 / -1; border-bottom: 2px solid var(--line); }
  .bottom > section:nth-child(3) { border-left: 2px solid var(--line); }
  .bottom h2 { margin: 0; padding: 5px 10px; font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--soft); }
  .bottom th, .bottom td { padding: 3px 4px; font-size: 11px; }
  .bottom td:first-child { max-width: 72px; overflow: hidden; text-overflow: ellipsis; }
  .scroll { overflow: auto; max-height: 144px; }
  .empty { padding: 14px; color: var(--muted); }
  .close-btn {
    border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px;
    padding: 1px 5px; cursor: pointer; font: inherit; font-size: 11px;
  }
  .close-btn + .close-btn { margin-left: 4px; }
  /* 票 109：交割前提醒——持仓表头下面一条，红字只在收盘前 30 分钟出现。 */
  .expiry-hint { padding: 4px 10px; font-size: 11px; color: var(--danger); border-bottom: 1px solid var(--soft); }
  .bulk-btn { float: right; margin-left: 8px; font-size: 11px; }
  .bulk-btn:disabled { opacity: .45; cursor: default; }
  .limit { margin-top: 6px; font-variant-numeric: tabular-nums; }
  .limit .lbl { color: var(--muted); font-size: 12px; }
  .limit .hint { color: var(--danger); font-size: 12px; }
  #place {
    padding: 3px 12px; border-radius: var(--radius); cursor: pointer; font: inherit;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  .banner {
    position: absolute; inset: 52px 0 auto 0; padding: 8px 14px; background: #fdf1c8;
    border-bottom: 1px solid var(--line); font-size: 12px;
  }
  #toast {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 5px 12px; border-radius: var(--radius);
    font-size: 12px; opacity: 0; transition: opacity .15s; pointer-events: none; max-width: 560px;
  }
  #toast.show { opacity: .95; }
  .mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">期货</span>
    <span class="week" id="week">—</span>
    <div class="stats">
      <span>可用 <b id="balance">—</b></span>
      <span>占用 <b id="marginUsed">—</b></span>
      <span>权益 <b id="equity">—</b></span>
      <span>本周 <b id="weekPnl">—</b></span>
      <span>保险基金 <b id="insurance">—</b></span>
      <span>欠账 <b id="shortfall">—</b></span>
      <span title="做市商这一侧的累计盈亏：玩家整体赢多少，这里就负多少。负得越多，说明系统净付出的硬币越多。">做市商 <b id="house">—</b></span>
    </div>
    <span class="count">本根 <b id="countdown">—</b></span>
    <button class="winClose" id="close" type="button" aria-label="关闭期货" title="关闭（Esc）">×</button>
  </header>

  <!-- 票 98 / 1.10.0 / 1.12.0：档位与暂停都是**每个账户自己的事**。左边徽章写「这本账是
       纸面还是真钱」，旁边一颗切换按钮任何人都能用；「暂停 / 继续」只停自己那本账，
       房主按下去也停不了别人的市；「退出」只退自己的余额。 -->
  <div class="modebar" id="modebar" hidden>
    <span class="chip" id="accountChip">—</span>
    <span class="modeText" id="accountText"></span>
    <button type="button" id="accountSwitch" class="accountBtn">切到真钱</button>
    <span class="caps mono" id="caps"></span>
    <span class="pending" id="pending" hidden></span>
    <span class="grow"></span>
    <span class="pauseText" id="pauseText"></span>
    <button type="button" id="pauseBtn" class="accountBtn">暂停交易</button>
    <button type="button" id="rollback" class="dangerBtn">退出</button>
  </div>

  <section class="quotes">
    <div class="delivery" id="delivery" hidden></div>
    <table>
      <thead>
        <tr><th>作物 · 合约</th><th>买一</th><th>卖一</th><th>价差</th><th>偏离指数</th><th>点差</th></tr>
      </thead>
      <tbody id="quotes"></tbody>
    </table>
    <div class="empty" id="quotesEmpty" hidden>周末休市，下周一 00:00 开新一周的合约。</div>
  </section>

  <section class="order">
    <div class="session" id="session" hidden></div>
    <div class="row">
      <div class="seg" id="side">
        <button type="button" data-side="long" class="on">做多</button>
        <button type="button" data-side="short">做空</button>
      </div>
      <select id="crop" aria-label="作物"></select>
      <div class="seg" id="leverage"></div>
      <label>保证金 <input id="margin" type="number" min="1" step="1" value="50"></label>
      <button type="button" id="withdraw">提现</button>
      <button type="button" id="submit">下单</button>
    </div>
    <div class="row preview">
      <span>一手 <b id="pLots">—</b> 张</span>
      <span>名义 <b id="pNotional">—</b></span>
      <span>保证金 <b id="pMargin">—</b></span>
      <span>手续费 <b id="pFee">—</b></span>
      <span>强平价 <b id="pLiquidation">—</b></span>
      <span class="bad" id="pReason"></span>
    </div>
    <!-- 票 95：限价挂单。价格与张数跟「吃价下单」分开填，免得一个输入框两种含义。 -->
    <div class="row limit">
      <span class="lbl">限价</span>
      <input id="limitPrice" type="number" min="0.01" step="0.01" placeholder="价格">
      <input id="limitLots" type="number" min="1" step="1" value="1" aria-label="张数">
      <span class="lbl">张</span>
      <button type="button" id="place">挂单</button>
      <span class="hint" id="placeHint"></span>
    </div>
  </section>

  <div class="bottom">
    <section>
      <h2>持仓<button class="close-btn bulk-btn" id="convertAll" type="button" title="把全部持仓按公允价转成现货（到期后只能现金结算）">全部转</button></h2>
      <div class="expiry-hint" id="expiryHint" hidden></div>
      <div class="scroll">
        <table>
          <thead><tr><th>合约</th><th>方向</th><th>张</th><th>入场</th><th>保证金</th><th>强平</th><th>浮盈亏</th><th></th></tr></thead>
          <tbody id="positions"></tbody>
        </table>
        <div class="empty" id="positionsEmpty">没有持仓。上面选个作物，下单。</div>
      </div>
    </section>
    <section>
      <h2 id="ordersTitle">我的挂单</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>合约</th><th>方向</th><th>价格</th><th>张数</th><th>剩余</th><th></th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
        <div class="empty" id="ordersEmpty">暂无挂单</div>
      </div>
    </section>
    <section>
      <h2>最近成交</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>时间</th><th>合约</th><th>方向</th><th>价格</th><th>张</th><th>费</th></tr></thead>
          <tbody id="trades"></tbody>
        </table>
        <div class="empty" id="tradesEmpty">还没有成交。</div>
      </div>
    </section>
  </div>
</div>
<div id="toast"></div>
<script src="futures-view.js"></script>
<script src="futures.js"></script>
</body>
</html>
