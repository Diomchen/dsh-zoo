<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      农场小窗（ticket 40 / 41）：不联网、不加载远程资源。
      窗口是 file:// 页面，读不到宿主 /state；地块/种子/作物/硬币/露水/日志/交易所
      全部由宿主随 `farm-window` 命令推过来，这里只画、只把「申请」交回主进程。

      视觉：奶油纸底 + 泥土色地块 + 贴纸投影；作物用 emoji，成熟角标在右上角。
      交易所页只画宿主算好的 bid/base/最近成交与总价，不在窗口里算价格。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>农场</title>
    <style>
      :root {
        --ink: #4a4038;
        --ink-soft: #7a6a5c;
        --muted: #a29486;
        --paper: #fdf6ec;
        --paper-deep: #f5ead8;
        --cream: #fffdf8;
        --soil: #c9a57a;
        --soil-deep: #a8835a;
        --green: #6f9b5f;
        --green-deep: #547c46;
        --gold: #e0a33c;
        --coral: #d97c6e;
        --line: #e6d8c4;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        height: calc(100% - 16px);
        margin: 8px;
        padding: 14px 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 16px;
        background:
          radial-gradient(circle at 12% 4%, rgba(255, 255, 255, 0.75), transparent 46%),
          linear-gradient(160deg, var(--paper) 0%, var(--cream) 58%, var(--paper-deep) 100%);
        border: 1px solid var(--line);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.3), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
      }
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .mark {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--green);
        color: #fff;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(84, 124, 70, 0.34);
      }
      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 2px 0 0;
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .close {
        appearance: none;
        flex: none;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(74, 64, 56, 0.08);
        color: var(--ink-soft);
        font: inherit;
        font-size: 15px;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(74, 64, 56, 0.16);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: rgba(201, 165, 122, 0.16);
      }
      .tab {
        appearance: none;
        flex: 1 1 0;
        padding: 5px 4px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-soft);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
      }
      .tab.active {
        background: var(--cream);
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(74, 64, 56, 0.18);
      }
      .tab:disabled {
        color: var(--muted);
        cursor: default;
      }
      .page {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1 1 auto;
        min-height: 0;
      }
      .page[hidden] {
        display: none !important;
      }
      .plots {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .plot {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-height: 108px;
        padding: 8px 9px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(201, 165, 122, 0.22), rgba(201, 165, 122, 0.4));
        box-shadow: inset 0 0 0 1px rgba(168, 131, 90, 0.3);
      }
      .plot[data-stage='mature'] {
        box-shadow: inset 0 0 0 2px rgba(224, 163, 60, 0.75), 0 4px 12px rgba(224, 163, 60, 0.18);
      }
      .plot[data-selected='true'] {
        outline: 2px dashed var(--green);
        outline-offset: 1px;
      }
      .plot-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 10px;
        font-weight: 700;
        color: var(--soil-deep);
      }
      .badge {
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 9.5px;
      }
      .badge.mature {
        background: var(--gold);
      }
      .plot-body {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .crop-icon {
        width: 38px;
        height: 38px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(255, 253, 248, 0.6);
        font-size: 22px;
      }
      .crop-icon.empty {
        font-size: 15px;
        color: var(--muted);
      }
      .crop-icon.growing {
        filter: saturate(0.9);
      }
      .plot-info {
        min-width: 0;
        font-size: 10.5px;
        line-height: 1.4;
        color: var(--ink-soft);
      }
      .plot-info strong {
        display: block;
        color: var(--ink);
        font-size: 11.5px;
      }
      .countdown {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .plot-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: auto;
      }
      .btn {
        appearance: none;
        padding: 4px 8px;
        border: 1px solid rgba(84, 124, 70, 0.26);
        border-radius: 8px;
        background: var(--cream);
        color: var(--green-deep);
        font: inherit;
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1.3;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: #f2f8ee;
      }
      .btn:disabled {
        color: var(--muted);
        border-color: rgba(122, 106, 92, 0.16);
        background: rgba(255, 253, 248, 0.55);
        cursor: default;
      }
      .btn.primary {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--green-deep);
      }
      .btn.harvest {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }
      .inventory {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 8px 10px;
        border-radius: 11px;
        background: rgba(255, 253, 248, 0.72);
        box-shadow: inset 0 0 0 1px var(--line);
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .inventory .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: baseline;
      }
      .inventory .label {
        font-weight: 700;
        color: var(--soil-deep);
      }
      .inventory .value {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .log {
        flex: 1 1 auto;
        min-height: 48px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .log h2 {
        margin: 0;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--soil-deep);
        letter-spacing: 0.04em;
      }
      .log ul {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ink-soft);
        scrollbar-width: thin;
        scrollbar-color: rgba(122, 106, 92, 0.3) transparent;
      }
      .log li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 1px 0;
      }
      .log .when {
        flex: none;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .log .empty {
        color: var(--muted);
      }
      .market-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 10.5px;
        color: var(--ink-soft);
      }
      .market-head strong {
        color: var(--soil-deep);
        font-size: 11px;
      }
      .market-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(122, 106, 92, 0.3) transparent;
      }
      .market-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 9px;
        border-radius: 11px;
        background: rgba(255, 253, 248, 0.72);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .market-row-head {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .market-row-head .emoji {
        font-size: 17px;
      }
      .market-row-head .name {
        flex: 1 1 auto;
        font-size: 11.5px;
        font-weight: 700;
      }
      .market-row-head .last {
        font-size: 9.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .market-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 10px;
        color: var(--ink-soft);
      }
      .market-stats b {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .market-trade {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .market-trade .qty-label {
        font-size: 9.5px;
        color: var(--muted);
      }
      .market-trade input {
        width: 48px;
        padding: 3px 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--cream);
        color: var(--ink);
        font: inherit;
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
      }
      .market-trade .total {
        margin-left: auto;
        font-size: 10px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .market-trade .btn.buy {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .market-trade .btn.sell {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }
      .trades {
        flex: 1 1 auto;
        min-height: 56px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .trades h2 {
        margin: 0;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--soil-deep);
        letter-spacing: 0.04em;
      }
      .trades ul {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ink-soft);
        scrollbar-width: thin;
        scrollbar-color: rgba(122, 106, 92, 0.3) transparent;
      }
      .trades li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 1px 0;
      }
      .trades .when {
        flex: none;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .trades .empty {
        color: var(--muted);
      }
      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 34px;
        padding: 7px 10px;
        border-radius: 9px;
        background: rgba(74, 64, 56, 0.92);
        color: #fff8ee;
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.3);
        pointer-events: none;
      }
      .toast[hidden] {
        display: none !important;
      }
      .toast[data-tone='error'] {
        background: rgba(174, 78, 66, 0.94);
      }
      footer {
        flex: none;
        font-size: 9.5px;
        line-height: 1.3;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="head">
        <div class="title">
          <span class="mark" aria-hidden="true">🌱</span>
          <div>
            <h1>农场</h1>
            <p class="subtitle" id="subtitle">正在等宿主把地块送过来…</p>
          </div>
        </div>
        <button class="close" id="close" type="button" aria-label="关闭农场">×</button>
      </header>

      <nav class="tabs" role="tablist" aria-label="农场页">
        <button class="tab active" type="button" role="tab" data-tab="farm" aria-selected="true">农场</button>
        <button class="tab" type="button" role="tab" data-tab="market" aria-selected="false">交易所</button>
        <button class="tab" type="button" role="tab" disabled title="雇工还没开放">雇工</button>
        <button class="tab" type="button" role="tab" disabled title="记录还没开放">记录</button>
      </nav>

      <section class="page" id="page-farm" role="tabpanel" aria-label="农场">
        <section class="plots" id="plots" aria-label="四块地"></section>

        <section class="inventory" id="inventory" aria-label="库存"></section>

        <section class="log">
          <h2>最近</h2>
          <ul id="log"></ul>
        </section>
      </section>

      <section class="page" id="page-market" role="tabpanel" aria-label="交易所" hidden>
        <div class="market-head">
          <strong>本机交易所</strong>
          <span id="market-wallet">🪙 0 · 永远有流动性</span>
        </div>
        <div class="market-rows" id="market-rows"></div>
        <section class="trades">
          <h2>最近成交</h2>
          <ul id="trades"></ul>
        </section>
      </section>

      <footer>数据由桌面宿主提供 · Esc 关闭</footer>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <script src="farm.js"></script>
  </body>
</html>
