<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      「带派」小窗（ticket 24）：不联网、不加载远程资源。
      它唯一能做的是把「要放进背包的东西」或「撤掉哪一件」当申请交给主进程。

      视觉语言与邻居面板（desktop/index.html 的 .lp-street）一致：
      奶油纸底 + 粗墨线 + 贴纸投影 + 一条半透明和纸胶带；
      小包裹 mascot 与图标全部是内联 SVG（没有图片请求，CSP 不需要放行 img-src）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>带派</title>
    <style>
      :root {
        --ink: #4a4a55;
        --ink-soft: #6f6f7a;
        --muted: #8a8a95;
        --paper: #fdf6ec;
        --paper-deep: #f6ecdd;
        --cream: #fffdf8;
        --pink: #f4a8a8;
        --pink-deep: #e98f8f;
        --yellow: #ffd166;
        --coral: #f2a7a0;
        --line: #e6d8c4;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
      }
      [hidden] {
        display: none !important;
      }
      .card {
        position: relative;
        margin: 10px;
        height: calc(100% - 20px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px 14px 12px;
        border: 2.5px solid var(--ink);
        border-radius: 20px;
        background-color: var(--paper);
        /* 一点纸纹：左上高光 + 10px 的极淡点阵，不加载任何图片。 */
        background-image:
          radial-gradient(circle at 18% -8%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 56%),
          radial-gradient(rgba(74, 74, 85, 0.05) 1px, transparent 1.1px);
        background-size: auto, 10px 10px;
        box-shadow: 4px 6px 0 rgba(74, 74, 85, 0.16), 0 16px 34px rgba(20, 24, 32, 0.3);
      }
      /* 贴在卡片上沿的和纸胶带：贴在「信」上的那一条，位置略微歪一点才像手贴的。 */
      .tape {
        position: absolute;
        top: -9px;
        left: 50%;
        width: 84px;
        height: 18px;
        transform: translateX(-50%) rotate(-2.4deg);
        border: 1.5px solid rgba(74, 74, 85, 0.18);
        border-radius: 3px;
        background: repeating-linear-gradient(
          45deg,
          rgba(244, 168, 168, 0.82) 0 7px,
          rgba(253, 224, 224, 0.92) 7px 14px
        );
        box-shadow: 0 2px 3px rgba(74, 74, 85, 0.08);
        pointer-events: none;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .mascot {
        flex: none;
        width: 42px;
        height: 42px;
        display: block;
      }
      .mascot svg {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 50% 90%;
        animation: lp-gift-bob 4.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .mascot svg {
          animation: none;
        }
      }
      @keyframes lp-gift-bob {
        0%,
        100% {
          transform: translateY(0) rotate(-1.4deg);
        }
        50% {
          transform: translateY(-2px) rotate(1.4deg);
        }
      }
      .titles {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: 0.04em;
      }
      .subtitle {
        margin-top: 2px;
        font-size: 10.5px;
        line-height: 1.35;
        letter-spacing: 0.02em;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .count {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px 3px 7px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        box-shadow: 0 2px 0 rgba(74, 74, 85, 0.18);
      }
      .count svg {
        flex: none;
        width: 13px;
        height: 13px;
      }
      .hint {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 5px 8px;
        border: 1.5px dashed #d9c6a9;
        border-radius: 9px;
        background: #fffaf0;
        color: #7a6a56;
        font-size: 10.5px;
        line-height: 1.5;
      }
      .hint::before {
        content: '✎';
        flex: none;
        color: #b08c5a;
        font-size: 11px;
        line-height: 1.45;
      }
      .composer {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 0 2px;
      }
      .field-label {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }
      .counter {
        font-size: 10px;
        line-height: 1.4;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      textarea {
        width: 100%;
        height: 106px;
        box-sizing: border-box;
        padding: 5px 10px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background-color: var(--cream);
        /* 横线信纸：24px 一条，跟 line-height 对齐；起点往下挪 9px，线落在字下面。 */
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 23px,
          var(--line) 23px 24px
        );
        background-position: 0 9px;
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
        line-height: 24px;
        caret-color: var(--pink-deep);
        outline: none;
        resize: none;
        user-select: text;
        -webkit-user-select: text;
        box-shadow: inset 0 2px 0 rgba(74, 74, 85, 0.05);
        transition: box-shadow 0.15s ease;
      }
      textarea::placeholder {
        color: #b3a48f;
      }
      textarea:focus {
        box-shadow: 0 0 0 3px rgba(244, 168, 168, 0.42), inset 0 2px 0 rgba(74, 74, 85, 0.05);
      }
      textarea:disabled {
        background-color: #f7f0e4;
        color: #a9a29a;
        cursor: default;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 27px;
        padding: 4px 7px;
        border: 1.5px dashed #cdb99a;
        border-radius: 11px;
        background: #fffaf0;
      }
      .picked {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        line-height: 1.4;
        color: var(--ink-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picked.empty {
        color: #a99a86;
      }
      .section {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      /* 背包没满时，右下角空出来的纸上盖一枚淡淡的「慢递」邮戳；
         满了就收起来，别压到第二件。 */
      .postmark {
        position: absolute;
        right: 4px;
        bottom: 4px;
        display: grid;
        place-items: center;
        width: 74px;
        height: 44px;
        border: 2px dashed rgba(74, 74, 85, 0.18);
        border-radius: 50%;
        color: rgba(74, 74, 85, 0.22);
        font-size: 10px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: 0.1em;
        text-align: center;
        transform: rotate(-9deg);
        pointer-events: none;
      }
      .postmark span {
        display: block;
        margin-top: 1px;
        font-size: 7px;
        letter-spacing: 0.18em;
      }
      .card[data-count='2'] .postmark {
        display: none;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 2px;
      }
      .section-title {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .section-title::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pink);
        box-shadow: 0 0 0 1.5px rgba(74, 74, 85, 0.55);
      }
      .section-sub {
        margin-left: auto;
        font-size: 9.5px;
        line-height: 1.4;
        color: var(--muted);
      }
      .items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        overflow-y: auto;
        min-height: 0;
      }
      .items li {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 7px;
        border: 1.5px solid rgba(74, 74, 85, 0.55);
        border-radius: 10px;
        background: #fff;
        font-size: 11.5px;
        line-height: 1.35;
        box-shadow: 0 2px 0 rgba(74, 74, 85, 0.12);
      }
      .item-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
      }
      /* 图标是装饰：kind 由 gift.js 写在 li 上，屏幕阅读器读到的仍是 label 的 aria-label。 */
      .item-text::before {
        content: '✉';
        margin-right: 6px;
        color: #c98a8a;
        font-size: 12px;
      }
      .items li[data-kind='file'] .item-text::before {
        content: '▤';
        color: #8fa6c4;
      }
      .item-out {
        flex: none;
        padding: 1px 6px;
        border: 1px solid #e7cf94;
        border-radius: 999px;
        background: #fff2c9;
        color: #92702a;
        font-size: 9.5px;
        line-height: 1.45;
        white-space: nowrap;
      }
      .items .empty-row {
        padding: 10px 8px;
        border: 1.5px dashed #d9c6a9;
        border-radius: 10px;
        background: #fffaf0;
        color: #a99a86;
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
        box-shadow: none;
      }
      .error {
        min-height: 14px;
        font-size: 10.5px;
        line-height: 1.4;
        color: #a3473e;
      }
      .error:not(:empty) {
        padding: 4px 8px;
        border: 1.5px solid #eab3ad;
        border-radius: 8px;
        background: #ffecea;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .foot-hint {
        flex: 1;
        min-width: 0;
        font-size: 9.5px;
        line-height: 1.4;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex: none;
        padding: 6px 12px;
        border: 2px solid var(--ink);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 2.5px 0 rgba(74, 74, 85, 0.24);
        transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      }
      .btn:hover {
        filter: brightness(1.03);
        transform: translateY(-1px);
        box-shadow: 0 3.5px 0 rgba(74, 74, 85, 0.24);
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 0.5px 0 rgba(74, 74, 85, 0.24);
      }
      .btn:focus-visible {
        outline: 3px solid rgba(244, 168, 168, 0.7);
        outline-offset: 2px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
        transform: none;
        filter: none;
      }
      .btn.quiet {
        border-color: rgba(74, 74, 85, 0.55);
        background: #fff;
        color: var(--ink-soft);
        font-weight: 700;
      }
      .btn.primary {
        background: var(--yellow);
        padding: 7px 14px;
      }
      .btn.primary::after {
        content: '→';
        font-weight: 700;
        color: rgba(74, 74, 85, 0.7);
      }
      .btn.primary:disabled::after {
        color: rgba(74, 74, 85, 0.35);
      }
      .btn.remove {
        padding: 2px 7px;
        border-width: 1.5px;
        border-color: #d98c84;
        border-radius: 7px;
        background: #fff4f2;
        color: #b5645b;
        font-size: 10px;
        font-weight: 700;
        box-shadow: 0 1.5px 0 rgba(217, 140, 132, 0.28);
      }
      .btn.remove:hover {
        transform: translateY(-1px);
        box-shadow: 0 2.5px 0 rgba(217, 140, 132, 0.28);
      }
      .btn.remove:active {
        transform: translateY(1px);
        box-shadow: 0 0.5px 0 rgba(217, 140, 132, 0.28);
      }
      .btn.remove:disabled {
        color: var(--muted);
        border-color: rgba(74, 74, 85, 0.2);
        background: #f7f2ea;
        box-shadow: none;
      }
      .icon {
        flex: none;
        width: 13px;
        height: 13px;
        display: block;
      }
    </style>
  </head>
  <body>
    <form id="form" class="card" autocomplete="off">
      <span class="tape" aria-hidden="true"></span>
      <div class="head">
        <!-- 小包裹 mascot：一只装着礼物的小纸箱。纯内联 SVG，不改动任何桥。 -->
        <span class="mascot" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="24" cy="44" rx="13" ry="2.4" fill="#4a4a55" opacity="0.12" />
            <path d="M17.5 40v3.2" stroke="#4a4a55" stroke-width="2.4" stroke-linecap="round" />
            <path d="M30.5 40v3.2" stroke="#4a4a55" stroke-width="2.4" stroke-linecap="round" />
            <rect x="8" y="17" width="32" height="23" rx="5" fill="#f6dcb8" />
            <path d="M8 24h32" stroke="#f4a8a8" stroke-width="5" />
            <rect x="8" y="17" width="32" height="23" rx="5" stroke="#4a4a55" stroke-width="2.4" />
            <path d="M8 24h32" stroke="#4a4a55" stroke-width="1.2" opacity="0.35" />
            <path
              d="M24 17c-5.4-7.6-13.4-3.6-8.2 1.8 2.4 2.5 8.2 1.3 8.2 1.3z"
              fill="#f4a8a8"
              stroke="#4a4a55"
              stroke-width="1.9"
              stroke-linejoin="round"
            />
            <path
              d="M24 17c5.4-7.6 13.4-3.6 8.2 1.8-2.4 2.5-8.2 1.3-8.2 1.3z"
              fill="#f4a8a8"
              stroke="#4a4a55"
              stroke-width="1.9"
              stroke-linejoin="round"
            />
            <circle cx="24" cy="17.2" r="2.5" fill="#f4a8a8" stroke="#4a4a55" stroke-width="1.8" />
            <circle cx="18" cy="31" r="1.9" fill="#4a4a55" />
            <circle cx="30" cy="31" r="1.9" fill="#4a4a55" />
            <circle cx="13.6" cy="33.8" r="2.2" fill="#f4a8a8" opacity="0.7" />
            <circle cx="34.4" cy="33.8" r="2.2" fill="#f4a8a8" opacity="0.7" />
            <path
              d="M21.4 34.1c1.7 1.7 3.5 1.7 5.2 0"
              stroke="#4a4a55"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <div class="titles">
          <div class="title">带派</div>
          <div class="subtitle">把好东西捎给邻居</div>
        </div>
        <div id="count" class="count">
          <svg class="icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2.4" y="5.2" width="11.2" height="8.4" rx="2.2" fill="#f6dcb8" stroke="#4a4a55" stroke-width="1.4" />
            <path d="M2.4 8h11.2" stroke="#f4a8a8" stroke-width="2" />
            <path d="M5.4 5.2V4.1a2.6 2.6 0 0 1 5.2 0v1.1" stroke="#4a4a55" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span id="count-text">背包 0/2</span>
        </div>
      </div>

      <div class="hint">出门时带上背包里先放的那一件。想换，就先撤掉。</div>

      <div class="composer">
        <div class="field-head">
          <span class="field-label">写一张字条</span>
          <span id="counter" class="counter">0/500</span>
        </div>
        <textarea
          id="text"
          rows="4"
          placeholder="写一张小纸条…"
          spellcheck="false"
        ></textarea>
      </div>

      <div class="file-row">
        <button type="button" id="pick" class="btn quiet">
          <svg class="icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M10.9 4.2 5.4 9.7a2 2 0 0 0 2.8 2.8l5.8-5.8a3.3 3.3 0 0 0-4.7-4.7L3.5 7.8"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          选文件…
        </button>
        <span id="picked" class="picked empty">也可以带一个文件（≤16 MB）</span>
        <button type="button" id="clear-picked" class="btn remove" hidden>清除</button>
      </div>

      <div class="section">
        <div class="section-head">
          <span class="section-title">背包</span>
          <span class="section-sub">先放的先走</span>
        </div>
        <ul id="items" class="items"></ul>
        <div class="postmark" aria-hidden="true">带派<span>慢 递</span></div>
      </div>

      <div id="error" class="error" role="alert"></div>

      <div class="actions">
        <span class="foot-hint">一次只带一件，回来还在</span>
        <button type="button" id="cancel" class="btn quiet">取消</button>
        <button type="submit" id="submit" class="btn primary">放进背包</button>
      </div>
    </form>
    <script src="gift.js"></script>
  </body>
</html>
