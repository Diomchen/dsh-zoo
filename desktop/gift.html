<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      「带派」小窗（ticket 24）：不联网、不加载远程资源。
      它唯一能做的是把「要放进背包的东西」或「撤掉哪一件」当申请交给主进程。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>带派</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #1f2937;
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        margin: 8px;
        padding: 12px 14px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.28), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-sizing: border-box;
        height: calc(100% - 16px);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #334155;
      }
      .count {
        font-size: 11px;
        color: #64748b;
      }
      .hint {
        font-size: 11px;
        line-height: 1.35;
        color: #94a3b8;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 14px;
        line-height: 1.4;
        padding: 6px 8px;
        border-radius: 9px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        background: #fff;
        outline: none;
        resize: none;
        user-select: text;
        -webkit-user-select: text;
      }
      textarea:focus {
        border-color: #3b74d8;
        box-shadow: 0 0 0 3px rgba(59, 116, 216, 0.18);
      }
      .counter {
        align-self: flex-end;
        font-size: 10px;
        color: #94a3b8;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
      }
      .picked {
        flex: 1;
        font-size: 12px;
        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picked.empty {
        color: #94a3b8;
      }
      .section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        color: #475569;
      }
      .items {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        min-height: 0;
      }
      .items li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-top: 1px solid rgba(15, 23, 42, 0.06);
        font-size: 12px;
      }
      .items li:first-child {
        border-top: none;
      }
      .item-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #334155;
      }
      .item-out {
        font-size: 10px;
        color: #94a3b8;
      }
      .items .empty-row {
        color: #94a3b8;
        font-size: 12px;
        border-top: none;
        padding: 2px 0;
      }
      .error {
        min-height: 15px;
        font-size: 11px;
        line-height: 1.35;
        color: #b42318;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn {
        font: inherit;
        font-size: 12px;
        padding: 5px 14px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: #3b74d8;
        color: #fff;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn.quiet {
        background: rgba(15, 23, 42, 0.06);
        color: #334155;
        font-size: 11px;
        padding: 4px 10px;
      }
      .btn.remove {
        background: transparent;
        color: #b42318;
        border-color: rgba(180, 35, 24, 0.25);
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 7px;
      }
      .btn.remove:disabled {
        color: #94a3b8;
        border-color: rgba(15, 23, 42, 0.12);
      }
    </style>
  </head>
  <body>
    <form id="form" class="card" autocomplete="off">
      <div class="head">
        <div class="title">带派</div>
        <div id="count" class="count">背包 0/2</div>
      </div>
      <div class="hint">出门时带上背包里先放的那一件。想换，就先撤掉。</div>
      <textarea id="text" rows="4" placeholder="写一张字条…" spellcheck="false"></textarea>
      <div id="counter" class="counter">0/500</div>
      <div class="file-row">
        <button type="button" id="pick" class="btn quiet">选文件…</button>
        <span id="picked" class="picked empty">也可以带一个文件（≤16 MB）</span>
        <button type="button" id="clear-picked" class="btn remove" hidden>清除</button>
      </div>
      <div class="section">
        <div class="section-title">背包</div>
        <ul id="items" class="items"></ul>
      </div>
      <div id="error" class="error" role="alert"></div>
      <div class="actions">
        <button type="button" id="cancel" class="btn quiet">取消</button>
        <button type="submit" id="submit" class="btn">放进背包</button>
      </div>
    </form>
    <script src="gift.js"></script>
  </body>
</html>
