<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      这个页面不联网、不加载远程资源：只允许同目录脚本、内联样式、data: 图片，
      以及 helper 自己注册的 localpet:// 素材协议（dsh-pet 的 WebM 文件）。
      礼物缩略图也走 localpet:// gifts 主机，所以 img-src 必须显式放行它，否则会被静默挡掉。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: localpet:; media-src localpet:; connect-src 'none'"
    />
    <title>dsh-local-pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        cursor: default;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /*
       * 一只宠物 = 一个 wrapper。整个 rect（媒体 + 下方昵称条）就是命中矩形：
       * 窗口默认整窗穿透，只有光标进入某只宠物时才由主进程接管鼠标。
       * 位置由渲染端每帧写 transform；left/top 永远留在 0。
       */
      .lp-pet {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        cursor: grab;
        transform: translate3d(0, 0, 0);
        will-change: transform;
        -webkit-user-drag: none;
      }
      .lp-pet[data-dragging='true'] {
        cursor: grabbing;
      }
      .lp-pet[data-dragging='true'] .lp-pet-media {
        transform: scale(1.06);
      }
      .lp-pet-media {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 80%;
        pointer-events: none;
      }
      .lp-pet-video,
      .lp-pet-svg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        pointer-events: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.28));
      }
      .lp-pet-name {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        max-width: 100%;
        box-sizing: border-box;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(15, 21, 29, 0.56);
        color: #f4f8ff;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
      }
      .lp-pet[data-role='self'] .lp-pet-name {
        background: rgba(47, 95, 168, 0.7);
      }
      .lp-pet[data-role='visitor'] .lp-pet-name {
        background: rgba(47, 143, 91, 0.74);
      }
      .lp-pet[data-role='guest'] .lp-pet-name {
        background: rgba(40, 48, 60, 0.58);
      }
      /* ------------------------------------------------------------------
       * 桌面控件（ticket 11）：弹层 / 放行卡 / 召回胶囊 / 提示气泡
       * 全部是鼠标控件；窗口没有键盘输入（focusable:false）。
       * 只有这些节点 pointer-events:auto，其余 #ui-layer 继续穿透。
       * ------------------------------------------------------------------ */
      #ui-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 10;
      }
      #ui-layer [hidden] {
        display: none !important;
      }
      .lp-popover,
      .lp-card,
      .lp-recall-chip,
      .lp-notice {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
      }
      .lp-popover {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 128px;
        max-width: 220px;
        padding: 8px;
        border-radius: 12px;
        background: rgba(15, 21, 29, 0.9);
        color: #f4f8ff;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.36), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        pointer-events: auto;
      }
      .lp-popover-title {
        max-width: 190px;
        padding: 0 2px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        color: rgba(244, 248, 255, 0.72);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lp-btn {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        color: #f4f8ff;
        background: rgba(59, 116, 216, 0.94);
        cursor: pointer;
        white-space: nowrap;
        pointer-events: auto;
      }
      .lp-btn:hover {
        filter: brightness(1.08);
      }
      .lp-btn-quiet {
        background: rgba(255, 255, 255, 0.13);
      }
      .lp-btn-danger {
        background: rgba(176, 74, 86, 0.94);
      }
      .lp-btn[data-disabled='true'] {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(244, 248, 255, 0.55);
        cursor: default;
        filter: none;
      }
      /* 邻居面板（ticket 21）：那条小街。奶油色 + 粗墨线，贴在深色桌面上像一张贴纸。 */
      .lp-street {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        width: 272px;
        padding: 10px 10px 6px;
        border: 2.5px solid #4a4a55;
        border-radius: 18px;
        background: #fdf6ec;
        color: #3f3f49;
        box-shadow: 4px 6px 0 rgba(74, 74, 85, 0.18), 0 18px 40px rgba(20, 24, 32, 0.3);
        pointer-events: auto;
      }
      .lp-street[data-away='true'] {
        filter: saturate(0.55) brightness(0.97);
      }
      .lp-street-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 0 2px 8px;
      }
      .lp-street-title {
        font-size: 13px;
        font-weight: 800;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lp-street-sub {
        flex: none;
        font-size: 11px;
        color: #8a8a95;
      }
      .lp-street-head .lp-btn {
        flex: none;
        padding: 4px 9px;
        font-size: 11px;
        background: #4a4a55;
      }
      .lp-street-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        max-height: 236px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .lp-street-empty {
        grid-column: 1 / -1;
        padding: 14px 4px;
        font-size: 11.5px;
        color: #8a8a95;
        text-align: center;
      }
      .lp-house {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 0;
        padding: 6px 4px 5px;
        border: 2px solid #4a4a55;
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        text-align: center;
        cursor: pointer;
        box-shadow: 2px 3px 0 rgba(74, 74, 85, 0.14);
        transition: transform 0.14s ease, box-shadow 0.14s ease;
      }
      .lp-house:hover {
        transform: translate(-1px, -2px) rotate(-0.6deg);
        box-shadow: 3px 5px 0 rgba(74, 74, 85, 0.16);
      }
      .lp-house[data-can-visit='false'] {
        cursor: default;
        opacity: 0.55;
        box-shadow: none;
      }
      .lp-house[data-can-visit='false']:hover {
        transform: none;
      }
      .lp-house-top {
        position: relative;
        width: 38px;
        height: 34px;
      }
      .lp-roof {
        position: absolute;
        top: 0;
        left: 3px;
        width: 32px;
        height: 15px;
        box-sizing: border-box;
        border: 2px solid #4a4a55;
        border-bottom: 0;
        border-radius: 17px 17px 0 0;
        background: var(--lp-roof, #f4a8a8);
      }
      .lp-wall {
        position: absolute;
        bottom: 0;
        left: 4px;
        width: 30px;
        height: 20px;
        box-sizing: border-box;
        display: grid;
        place-items: end center;
        overflow: hidden;
        border: 2px solid #4a4a55;
        border-radius: 0 0 7px 7px;
        background: #fff;
      }
      .lp-face {
        position: relative;
        width: 22px;
        height: 22px;
        margin-bottom: -3px;
        box-sizing: border-box;
        border: 2px solid #4a4a55;
        border-radius: 50%;
      }
      .lp-eye {
        position: absolute;
        top: 42%;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #3d3d46;
      }
      .lp-eye-l {
        left: 24%;
      }
      .lp-eye-r {
        right: 24%;
      }
      /* 悬停：脑袋从窗户里探出来晃；动作变了的那一户自己探一次头。 */
      .lp-house:hover .lp-face,
      .lp-face[data-peek='true'] {
        animation: lp-peek 0.55s ease-in-out infinite alternate;
      }
      .lp-face[data-peek='true'] {
        animation-iteration-count: 4;
      }
      @keyframes lp-peek {
        from {
          transform: translateY(0) rotate(-4deg);
        }
        to {
          transform: translateY(-4px) rotate(5deg);
        }
      }
      .lp-house-name {
        max-width: 104px;
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lp-house-doing {
        max-width: 104px;
        font-size: 10.5px;
        line-height: 1.3;
        color: #8a8a95;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lp-street-more {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 4px;
        padding: 7px 2px 3px;
        border: 0;
        border-top: 2px dashed #e2d8c8;
        background: transparent;
        color: #6f6f7a;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .lp-street-more[hidden] {
        display: none;
      }
      .lp-why {
        max-width: 200px;
        padding: 0 2px;
        font-size: 10.5px;
        line-height: 1.45;
        color: rgba(244, 248, 255, 0.7);
      }
      .lp-card {
        width: 232px;
        padding: 10px 10px 9px;
        border-radius: 14px;
        background: rgba(15, 21, 29, 0.93);
        color: #f4f8ff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        pointer-events: auto;
      }
      .lp-card-head {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      .lp-card-title {
        flex: 1;
        padding-top: 1px;
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.4;
      }
      .lp-card-text {
        margin: 4px 0 9px;
        font-size: 11px;
        line-height: 1.5;
        color: rgba(244, 248, 255, 0.72);
      }
      .lp-card-actions {
        display: flex;
        gap: 6px;
      }
      .lp-card-actions .lp-btn {
        flex: 1;
      }
      /* 礼物卡（ticket 23）：奶油纸 + 粗墨线 + 一条和纸胶带，和邻居面板同一套贴纸语言。
         正文最多 8 行；便条的换行是内容本身（pre-wrap），不能用 .lp-card-text 的单行样式。
         右上角那张小「邮票」按 kind 写「信」或「件」，标题给它留出 24px。 */
      .lp-gift-card {
        width: 258px;
        padding: 13px 12px 11px;
        border: 2.5px solid #4a4a55;
        border-radius: 16px;
        background-color: #fdf6ec;
        background-image:
          radial-gradient(circle at 16% -10%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 58%),
          radial-gradient(rgba(74, 74, 85, 0.05) 1px, transparent 1.1px);
        background-size: auto, 10px 10px;
        color: #3f3f49;
        box-shadow: 4px 6px 0 rgba(74, 74, 85, 0.16), 0 14px 30px rgba(20, 24, 32, 0.28);
      }
      .lp-gift-card::before {
        content: '';
        position: absolute;
        top: -8px;
        left: 50%;
        width: 62px;
        height: 16px;
        transform: translateX(-50%) rotate(-3deg);
        border: 1.5px solid rgba(74, 74, 85, 0.16);
        border-radius: 3px;
        background: repeating-linear-gradient(
          45deg,
          rgba(244, 168, 168, 0.82) 0 6px,
          rgba(253, 224, 224, 0.92) 6px 12px
        );
        box-shadow: 0 2px 3px rgba(74, 74, 85, 0.08);
        pointer-events: none;
      }
      .lp-gift-card::after {
        content: '信';
        position: absolute;
        top: 8px;
        right: 9px;
        display: grid;
        place-items: center;
        width: 17px;
        height: 19px;
        box-sizing: border-box;
        border: 1.5px dashed #cbbba2;
        border-radius: 3px;
        background: #fffdf7;
        color: #b98a8a;
        font-size: 9px;
        font-weight: 800;
        line-height: 1;
        transform: rotate(6deg);
        pointer-events: none;
      }
      .lp-gift-card[data-kind='file']::after {
        content: '件';
        color: #7f9bb8;
      }
      .lp-gift-card .lp-card-title {
        padding: 1px 24px 0 0;
        color: #3f3f49;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.45;
        letter-spacing: 0.01em;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .lp-gift-text {
        margin: 6px 0 8px;
        padding: 6px 9px 6px 11px;
        box-sizing: border-box;
        border: 1.5px solid #e2d4bf;
        border-left: 3px solid #f4a8a8;
        border-radius: 4px 9px 9px 4px;
        background-color: #fffdf7;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0 19px,
          #f0e5d3 19px 20px
        );
        background-position: 0 5px;
        color: #4a4a55;
        font-size: 11.5px;
        line-height: 20px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 8;
        overflow: hidden;
      }
      .lp-gift-text[hidden] {
        display: none;
      }
      .lp-gift-card .lp-gift-status {
        display: inline-block;
        margin: 5px 0 8px;
        padding: 2px 8px;
        border: 1.5px dashed #e3cfa9;
        border-radius: 999px;
        background: #fff6dd;
        color: #8a6d3b;
        font-size: 10px;
        line-height: 1.5;
      }
      .lp-gift-card .lp-gift-status[hidden] {
        display: none;
      }
      /* 文件卡（ticket 25）：缩略图放在浅色「照片夹」里，最多高 92px；
         没有缩略图就画一张纸质文件图标 + 名字 + 大小。 */
      .lp-gift-card .lp-gift-file {
        margin: 7px 0 8px;
        padding: 7px;
        border: 1.5px dashed #d9c6a9;
        border-radius: 11px;
        background: #fffaf0;
      }
      .lp-gift-card .lp-gift-file[hidden] {
        display: none;
      }
      .lp-gift-card .lp-gift-thumb {
        display: block;
        width: 100%;
        max-height: 92px;
        margin-bottom: 6px;
        box-sizing: border-box;
        border: 2px solid #4a4a55;
        border-radius: 8px;
        object-fit: cover;
        background: #fff;
        box-shadow: 0 2px 0 rgba(74, 74, 85, 0.14);
        transform: rotate(-0.8deg);
      }
      .lp-gift-card .lp-gift-thumb[hidden] {
        display: none;
      }
      .lp-gift-card .lp-gift-file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .lp-gift-card .lp-gift-file-icon {
        flex: none;
        width: 27px;
        height: 31px;
        box-sizing: border-box;
        border: 2px solid #4a4a55;
        border-radius: 5px;
        background: #fff;
        color: #8a8a95;
        font-size: 15px;
        line-height: 27px;
        text-align: center;
        box-shadow: 0 2px 0 rgba(74, 74, 85, 0.16);
      }
      .lp-gift-card .lp-gift-file-meta {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .lp-gift-card .lp-gift-file-name {
        color: #3f3f49;
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .lp-gift-card .lp-gift-file-size {
        color: #8a8a95;
        font-size: 10px;
        line-height: 1.35;
      }
      .lp-gift-card .lp-gift-file-size[hidden] {
        display: none;
      }
      .lp-gift-card .lp-gift-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .lp-gift-card .lp-gift-actions .lp-btn {
        padding: 6px 7px;
        border: 2px solid #4a4a55;
        border-radius: 9px;
        background: #fff;
        color: #3f3f49;
        font-size: 11px;
        font-weight: 800;
        line-height: 1.2;
        box-shadow: 0 2.5px 0 rgba(74, 74, 85, 0.22);
        transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
      }
      .lp-gift-card .lp-gift-actions .lp-btn:hover {
        filter: brightness(1.03);
        transform: translateY(-1px);
        box-shadow: 0 3.5px 0 rgba(74, 74, 85, 0.22);
      }
      .lp-gift-card .lp-gift-actions .lp-btn:active {
        transform: translateY(2px);
        box-shadow: 0 0.5px 0 rgba(74, 74, 85, 0.22);
      }
      .lp-gift-card .lp-gift-actions .lp-btn[data-lp-action='gift-open'] {
        background: #ffd166;
      }
      .lp-gift-card .lp-gift-actions .lp-btn[data-lp-action='gift-discard'] {
        background: #f7b3ad;
      }
      .lp-gift-card .lp-gift-actions .lp-btn[data-disabled='true'],
      .lp-gift-card .lp-gift-actions .lp-btn[data-disabled='true']:hover {
        background: #f1e9dc;
        color: #a9a29a;
        border-color: #b9b1a5;
        box-shadow: none;
        transform: none;
        filter: none;
      }
      .lp-gift-actions .lp-btn[hidden] {
        display: none;
      }
      .lp-x {
        appearance: none;
        flex: none;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(244, 248, 255, 0.72);
        font: inherit;
        font-size: 13px;
        line-height: 18px;
        text-align: center;
        cursor: pointer;
      }
      .lp-recall-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(15, 21, 29, 0.9);
        color: #f4f8ff;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        pointer-events: auto;
      }
      .lp-recall-chip .lp-chip-sub {
        font-size: 10.5px;
        font-weight: 500;
        color: rgba(244, 248, 255, 0.66);
      }
      .lp-notice {
        max-width: 246px;
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(15, 21, 29, 0.92);
        color: #f4f8ff;
        font-size: 11.5px;
        font-weight: 500;
        line-height: 1.5;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      /* 右键菜单（ticket 22）：每级一个独立面板，位置由 renderer 用 shared.placeMenu 写死，
         面板之间平级、各自滚动——子面板不嵌进父面板，才不会一起被裁掉。 */
      .lp-menu {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 30;
        pointer-events: auto;
        user-select: none;
      }
      .lp-menu-panel {
        position: absolute;
        min-width: 148px;
        max-width: 280px;
        max-height: min(62vh, 460px);
        overflow-y: auto;
        padding: 4px;
        border-radius: 10px;
        background: rgba(15, 21, 29, 0.94);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        font-size: 12px;
        line-height: 1.4;
        color: #f4f8ff;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
      }
      .lp-menu-panel::-webkit-scrollbar {
        width: 8px;
      }
      .lp-menu-panel::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
