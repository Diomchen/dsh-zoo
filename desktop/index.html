<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      这个页面不联网、不加载远程资源：只允许同目录脚本、内联样式、data: 图片，
      以及 helper 自己注册的 localpet:// 素材协议（dsh-pet 的 WebM 文件）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src localpet:; connect-src 'none'"
    />
    <title>dsh-local-pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        cursor: default;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /*
       * 一只宠物 = 一个 wrapper。整个 rect（媒体 + 下方昵称条）就是命中矩形：
       * 窗口默认整窗穿透，只有光标进入某只宠物时才由主进程接管鼠标。
       * 位置由渲染端每帧写 transform；left/top 永远留在 0。
       */
      .lp-pet {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        cursor: grab;
        transform: translate3d(0, 0, 0);
        will-change: transform;
        -webkit-user-drag: none;
      }
      .lp-pet[data-dragging='true'] {
        cursor: grabbing;
      }
      .lp-pet[data-dragging='true'] .lp-pet-media {
        transform: scale(1.06);
      }
      .lp-pet-media {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 80%;
        pointer-events: none;
      }
      .lp-pet-video,
      .lp-pet-svg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        pointer-events: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.28));
      }
      .lp-pet-name {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        max-width: 100%;
        box-sizing: border-box;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(15, 21, 29, 0.56);
        color: #f4f8ff;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
      }
      .lp-pet[data-role='self'] .lp-pet-name {
        background: rgba(47, 95, 168, 0.7);
      }
      .lp-pet[data-role='visitor'] .lp-pet-name {
        background: rgba(47, 143, 91, 0.74);
      }
      .lp-pet[data-role='guest'] .lp-pet-name {
        background: rgba(40, 48, 60, 0.58);
      }
      /* ------------------------------------------------------------------
       * 桌面控件（ticket 11）：弹层 / 放行卡 / 召回胶囊 / 提示气泡
       * 全部是鼠标控件；窗口没有键盘输入（focusable:false）。
       * 只有这些节点 pointer-events:auto，其余 #ui-layer 继续穿透。
       * ------------------------------------------------------------------ */
      #ui-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 10;
      }
      #ui-layer [hidden] {
        display: none !important;
      }
      .lp-popover,
      .lp-card,
      .lp-recall-chip,
      .lp-notice {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
      }
      .lp-popover {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 128px;
        max-width: 220px;
        padding: 8px;
        border-radius: 12px;
        background: rgba(15, 21, 29, 0.9);
        color: #f4f8ff;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.36), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        pointer-events: auto;
      }
      .lp-popover-title {
        max-width: 190px;
        padding: 0 2px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        color: rgba(244, 248, 255, 0.72);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lp-btn {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 7px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        color: #f4f8ff;
        background: rgba(59, 116, 216, 0.94);
        cursor: pointer;
        white-space: nowrap;
        pointer-events: auto;
      }
      .lp-btn:hover {
        filter: brightness(1.08);
      }
      .lp-btn-quiet {
        background: rgba(255, 255, 255, 0.13);
      }
      .lp-btn-danger {
        background: rgba(176, 74, 86, 0.94);
      }
      .lp-btn[data-disabled='true'] {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(244, 248, 255, 0.55);
        cursor: default;
        filter: none;
      }
      .lp-why {
        max-width: 200px;
        padding: 0 2px;
        font-size: 10.5px;
        line-height: 1.45;
        color: rgba(244, 248, 255, 0.7);
      }
      .lp-card {
        width: 232px;
        padding: 10px 10px 9px;
        border-radius: 14px;
        background: rgba(15, 21, 29, 0.93);
        color: #f4f8ff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        pointer-events: auto;
      }
      .lp-card-head {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      .lp-card-title {
        flex: 1;
        padding-top: 1px;
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.4;
      }
      .lp-card-text {
        margin: 4px 0 9px;
        font-size: 11px;
        line-height: 1.5;
        color: rgba(244, 248, 255, 0.72);
      }
      .lp-card-actions {
        display: flex;
        gap: 6px;
      }
      .lp-card-actions .lp-btn {
        flex: 1;
      }
      .lp-x {
        appearance: none;
        flex: none;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(244, 248, 255, 0.72);
        font: inherit;
        font-size: 13px;
        line-height: 18px;
        text-align: center;
        cursor: pointer;
      }
      .lp-recall-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(15, 21, 29, 0.9);
        color: #f4f8ff;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        pointer-events: auto;
      }
      .lp-recall-chip .lp-chip-sub {
        font-size: 10.5px;
        font-weight: 500;
        color: rgba(244, 248, 255, 0.66);
      }
      .lp-notice {
        max-width: 246px;
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(15, 21, 29, 0.92);
        color: #f4f8ff;
        font-size: 11.5px;
        font-weight: 500;
        line-height: 1.5;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui-layer" aria-live="polite"></div>
    <script src="shared.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
