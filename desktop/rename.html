<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      改名小窗：不联网、不加载远程资源。它唯一的能力是把一个字符串交回主进程。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>改名</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #1f2937;
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        margin: 8px;
        padding: 14px 16px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.28), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-sizing: border-box;
        height: calc(100% - 16px);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #334155;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 16px;
        padding: 7px 10px;
        border-radius: 9px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        background: #fff;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }
      input:focus {
        border-color: #3b74d8;
        box-shadow: 0 0 0 3px rgba(59, 116, 216, 0.18);
      }
      .error {
        min-height: 15px;
        font-size: 12px;
        color: #b42318;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn {
        font: inherit;
        font-size: 13px;
        padding: 6px 16px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: #3b74d8;
        color: #fff;
        cursor: pointer;
      }
      .btn.quiet {
        background: rgba(15, 23, 42, 0.06);
        color: #334155;
      }
      .hint {
        font-size: 11px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <form id="form" class="card" autocomplete="off">
      <div class="title">给它改个名字</div>
      <input id="name" type="text" autocomplete="off" spellcheck="false" />
      <div id="error" class="error" role="alert"></div>
      <div class="actions">
        <button type="button" id="cancel" class="btn quiet">取消</button>
        <button type="submit" id="save" class="btn">保存</button>
      </div>
      <div class="hint">回车保存 · Esc 取消 · 最多 <span id="limit">32</span> 个字</div>
    </form>
    <script src="rename.js"></script>
  </body>
</html>
