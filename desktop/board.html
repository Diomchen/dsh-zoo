<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      盘口小窗（票 79–85 / 87）：三作物 K 线（15 分/1 时/1 日/1 周）、下单、到价挂单/撤单、
      持仓/止损、最近结算、本周盈亏、真人周榜与 LAN 情绪。图表上的周期只是看盘视角；
      合约仍按 15 分钟收盘结算（ADR-0029 第 4 条）。

      票 87：图占满 720 宽（viewBox 720×280，右侧价格轴 + 底部时间轴 + 十字线便签），
      下面两列左=持仓/最近结算、右=下单/周榜；窗口固定 760×700，页面本身不滚动。
      网格/蜡烛/参考线套 SVG 手绘滤镜，轴字/便签文字在另一层保持清晰；下单主按钮
      固定在卡片底部（控件区自己滚），半高布局下也能一键开仓。

      和农场窗同一条安全模型：file:// 页面，不联网、不加载远程资源、读不到宿主
      /state。行情、硬币、持仓、挂单、历史、周盈亏、风向、真人周榜全部由宿主随
      `board-window` 命令推过来，这里只画、只把「申请」交回主进程。窗口能收键盘
      （focusable），失焦策略见 ADR-0029：点窗口外面会收起所有插件窗，输入法合成期间例外。

      Tab 顺序 = DOM 顺序：作物页签 → 周期页签 → 方向 → 保证金 → 杠杆 → 到价开关
      → 目标价输入框 → 挂单按钮（后两个只在「到价」点开时出现）→ 开一手 → 每张挂单的撤单
      → 每手仓位的止损/平仓。右栏（下单）在 DOM 里紧跟在图表之后，靠 grid-area 放到视觉
      右侧；开仓按钮虽然在滚动区外，tabindex 仍由 `focusOrder()` 落到正确位置。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' dshzoo:"
    />
    <title>盘口</title>
    <style>
      :root {
        --cream: #faf8f5;
        --card: #fffdfa;
        --ink: #2f3a34;
        --ink-soft: #626a63;
        --muted: #666d66;
        --line: #ede5da;
        --emerald: #2e9e6b;
        --emerald-btn: #23815a;
        --emerald-deep: #1b6b4a;
        --emerald-soft: #e8f6ee;
        --amber: #e7a23a;
        --amber-ink: #8a5a12;
        --amber-soft: #fdf3e2;
        --rose: #c25b50;
        --rose-ink: #a8352a;
        --rose-soft: #fbeae7;
        --line-strong: #ded4c4;
        --disabled-bg: #f2efe8;
        --disabled-ink: #8d8b82;
        --focus: #1f7a52;
        --shadow-soft: 0 4px 14px rgba(63, 54, 38, 0.07);
        --shadow-lift: 0 10px 26px rgba(63, 54, 38, 0.13);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: calc(100% - 16px);
        margin: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 22px;
        background:
          radial-gradient(circle at 10% -8%, rgba(255, 255, 255, 0.9), transparent 42%),
          linear-gradient(168deg, #fffdf9 0%, var(--cream) 56%, #f6f1e9 100%);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .topbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px 6px;
        background: rgba(255, 255, 255, 0.74);
        border-bottom: 1px solid var(--line);
        /* 票 85 / ADR-0029：只有标题栏是拖动区；下面的按钮/页签/输入必须 no-drag，
           否则点「×」会变成拖窗口。标题栏以外默认不可拖。 */
        -webkit-app-region: drag;
      }
      .topbar button,
      .topbar a,
      .topbar input,
      .topbar select,
      .topbar textarea,
      .topbar [role='button'],
      .topbar [role='tab'],
      .topbar [contenteditable='true'] {
        -webkit-app-region: no-drag;
      }
      .drag-grip {
        flex: none;
        color: var(--line-strong);
        font-size: 14px;
        line-height: 1;
        letter-spacing: -2px;
        user-select: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--emerald-soft);
        font-size: 16px;
      }
      .brand-text h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .brand-text p {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .week {
        display: flex;
        align-items: baseline;
        gap: 5px;
        flex: none;
        margin-left: auto;
        padding: 5px 10px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        font-size: 11px;
        white-space: nowrap;
      }
      .week b {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .week b[data-tone='up'] {
        color: var(--emerald-deep);
      }
      .week b[data-tone='down'] {
        color: var(--rose-ink);
      }
      .week span {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .countdown {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        flex: none;
        min-width: 68px;
      }
      .countdown b {
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }
      .countdown span {
        font-size: 10px;
        color: var(--muted);
      }
      .wallet {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: var(--card);
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .pill small {
        color: var(--muted);
        font-weight: 500;
      }
      .pill b {
        font-variant-numeric: tabular-nums;
      }
      .close {
        width: 26px;
        height: 26px;
        flex: none;
        border: none;
        border-radius: 9px;
        background: rgba(47, 58, 52, 0.06);
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      .close:hover {
        background: var(--rose-soft);
        color: var(--rose-ink);
      }
      .body {
        flex: 1;
        min-height: 0;
        display: grid;
        /* 票 87：上图下两列——图占满整行，下面左侧持仓/结算、右侧下单/周榜。 */
        grid-template-columns: minmax(0, 1fr) 308px;
        grid-template-rows: auto minmax(0, 1.85fr) minmax(0, 1fr);
        grid-template-areas:
          'chart chart'
          'positions order'
          'history neighbor';
        gap: 10px;
        padding: 8px 12px 10px;
        overflow: hidden;
      }
      .card {
        min-width: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        padding: 8px 10px;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .card-head h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--ink-soft);
      }
      .card-head span {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .scroll {
        overflow-y: auto;
        padding-right: 2px;
      }
      .scroll::-webkit-scrollbar {
        width: 6px;
      }
      .scroll::-webkit-scrollbar-thumb {
        background: rgba(47, 58, 52, 0.18);
        border-radius: 999px;
      }
      /* ------------------------------ 图表 ------------------------------ */
      .chart-card {
        grid-area: chart;
        display: flex;
        flex-direction: column;
        /* 图要占满 720：边框+内边距之外都是绘图区，轴字在 SVG 里自己留白。 */
        padding: 7px 10px 6px;
      }
      .chart-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        min-width: 0;
      }
      .crop-tabs {
        display: flex;
        gap: 4px;
        flex: none;
      }
      .crop-tab {
        padding: 3px 8px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--card);
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .crop-tab:hover {
        border-color: var(--emerald);
      }
      .crop-tab[aria-pressed='true'] {
        border-color: var(--emerald-btn);
        background: var(--emerald-soft);
        color: var(--emerald-deep);
      }
      /* 票 84：周期页签比作物页签更紧凑——它只是看盘视角，不是交易对象。 */
      .timeframe-tabs {
        display: flex;
        gap: 3px;
        flex: none;
      }
      .timeframe-tab {
        padding: 2px 6px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .timeframe-tab:hover:enabled {
        border-color: var(--emerald);
      }
      .timeframe-tab[aria-pressed='true'] {
        border-color: var(--emerald-btn);
        background: var(--emerald-soft);
        color: var(--emerald-deep);
      }
      .timeframe-tab:disabled {
        border-color: var(--line);
        background: var(--disabled-bg);
        color: var(--disabled-ink);
        cursor: default;
      }
      .chart-quote {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin-left: auto;
        min-width: 0;
      }
      .chart-price {
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .chart-price[data-tone='up'] {
        color: var(--emerald-deep);
      }
      .chart-price[data-tone='down'] {
        color: var(--rose-ink);
      }
      .chart-change {
        font-size: 10px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .wind {
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--amber-soft);
        color: var(--amber-ink);
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
      }
      .wind[data-tone='up'] {
        background: var(--emerald-soft);
        color: var(--emerald-deep);
      }
      .wind[data-tone='down'] {
        background: var(--rose-soft);
        color: var(--rose-ink);
      }
      .wind small {
        font-weight: 500;
        opacity: 0.75;
        margin-left: 3px;
      }
      .chart-svg {
        display: block;
        width: 100%;
        height: 280px;
        font-family: inherit;
        shape-rendering: geometricPrecision;
      }
      /* 手绘墨迹层：滤镜只套这里；下面的文字层不套，轴标签/便签始终清晰。 */
      .chart-svg .chart-paper {
        fill: #fffefb;
        stroke: #f0e8dc;
        stroke-width: 1;
      }
      .chart-svg .grid {
        stroke: rgba(47, 58, 52, 0.16);
        stroke-width: 1;
        stroke-dasharray: 1 5;
        stroke-linecap: round;
      }
      .chart-svg .ref {
        stroke-width: 1.5;
        stroke-dasharray: 7 5;
        stroke-linecap: round;
      }
      .chart-svg .ref[data-key='base'] {
        stroke: var(--amber);
      }
      .chart-svg .ref[data-key='entry'] {
        stroke: var(--emerald);
      }
      .chart-svg .ref[data-key='liquidation'] {
        stroke: var(--rose);
      }
      .chart-svg .wick {
        fill: none;
        stroke-linecap: round;
      }
      .chart-svg .wick.up {
        stroke: var(--emerald);
      }
      .chart-svg .wick.down {
        stroke: var(--rose);
      }
      .chart-svg .body.up {
        fill: var(--emerald);
        stroke: var(--emerald-deep);
      }
      .chart-svg .body.down {
        fill: var(--rose);
        stroke: var(--rose-ink);
      }
      .chart-svg .body.forming {
        opacity: 0.55;
      }
      .chart-svg .price-line {
        stroke: var(--ink-soft);
        stroke-width: 1;
        stroke-dasharray: 3 3;
        opacity: 0.35;
      }
      .chart-svg .price-leader {
        fill: none;
        stroke: var(--ink-soft);
        stroke-width: 1.2;
        stroke-linecap: round;
        opacity: 0.75;
      }
      .chart-svg .price-tag {
        stroke-width: 1.4;
      }
      .chart-svg .price-tag.up {
        fill: var(--emerald-soft);
        stroke: var(--emerald);
      }
      .chart-svg .price-tag.down {
        fill: var(--rose-soft);
        stroke: var(--rose);
      }
      .chart-svg .price-tag-text {
        font-size: 10px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .chart-svg .price-tag-text.up {
        fill: var(--emerald-deep);
      }
      .chart-svg .price-tag-text.down {
        fill: var(--rose-ink);
      }
      .chart-svg .axis-line {
        stroke: rgba(47, 58, 52, 0.3);
        stroke-width: 1;
        stroke-linecap: round;
      }
      .chart-svg .axis-tick {
        stroke: rgba(47, 58, 52, 0.32);
        stroke-width: 1;
      }
      .chart-svg .axis-text {
        font-size: 9px;
        fill: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .chart-svg .ref-label {
        font-size: 9px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        paint-order: stroke;
        stroke: #fffefb;
        stroke-width: 2.4px;
        stroke-linejoin: round;
      }
      .chart-svg .ref-label-base {
        fill: var(--amber-ink);
      }
      .chart-svg .ref-label-entry {
        fill: var(--emerald-deep);
      }
      .chart-svg .ref-label-liquidation {
        fill: var(--rose-ink);
      }
      /* 十字线 + 便签：独立覆盖层，不套墨迹滤镜（文字和虚线要准、要清晰）。 */
      .chart-svg .crosshair-line {
        stroke: var(--ink-soft);
        stroke-width: 1;
        stroke-dasharray: 3 4;
        opacity: 0.65;
      }
      .chart-svg .crosshair-highlight {
        fill: rgba(231, 162, 58, 0.2);
        stroke: var(--amber);
        stroke-width: 1.4;
        stroke-dasharray: 3 2;
      }
      .chart-svg .crosshair-card {
        fill: #fff8e8;
        stroke: var(--amber);
        stroke-width: 1.3;
        stroke-dasharray: 5 3;
      }
      .chart-svg .crosshair-fold {
        fill: #f6e6c6;
        stroke: var(--amber);
        stroke-width: 1;
      }
      .chart-svg .crosshair-title {
        font-size: 9px;
        font-weight: 700;
        fill: var(--amber-ink);
      }
      .chart-svg .crosshair-label {
        font-size: 9px;
        fill: var(--muted);
      }
      .chart-svg .crosshair-value {
        font-size: 9.5px;
        font-weight: 600;
        fill: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .chart-empty {
        margin: 0;
        height: 280px;
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }
      .chart-empty[hidden] {
        display: none;
      }
      .chart-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
        font-size: 9.5px;
        min-width: 0;
      }
      .legend {
        display: flex;
        gap: 8px;
        flex: none;
        font-size: 9.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 2px;
        margin-right: 3px;
        vertical-align: middle;
      }
      .legend i.base {
        background: var(--amber);
      }
      .legend i.entry {
        background: var(--emerald);
      }
      .legend i.liquidation {
        background: var(--rose);
      }
      .legend b {
        color: var(--ink-soft);
        font-weight: 600;
      }
      .slot-note {
        font-size: 9.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        flex: none;
      }
      /* 票 84：切到粗周期时的一行提示。用 visibility 占位，切周期时窗口不跳。 */
      .chart-settle-hint {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 9.5px;
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        visibility: hidden;
      }
      .chart-settle-hint[data-visible='true'] {
        visibility: visible;
      }
      /* ------------------------------ 下单 ------------------------------ */
      .order-card {
        grid-area: order;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 9px;
        /* 票 87：下半区变矮，控件区自己滚；「开一手」固定在卡片底部永远可见。 */
        overflow: hidden;
      }
      .order-card .card-head {
        margin-bottom: 0;
        flex: none;
      }
      .order-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 2px;
      }
      .order-actions {
        flex: none;
        padding-top: 3px;
        border-top: 1px dashed var(--line);
      }
      .field-label {
        font-size: 9.5px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      /* 票 87：下半区变矮，方向/杠杆并排、标签贴左，省下一整行。 */
      .field-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .field-row .field-label {
        margin: 0;
        flex: none;
      }
      .field-row .side-row {
        flex: 1.05;
      }
      .field-row .leverage-row {
        flex: 1;
      }
      .chip-row {
        display: flex;
        gap: 4px;
        min-width: 0;
      }
      .chip {
        flex: 1;
        min-width: 0;
        padding: 4px 5px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--card);
        color: var(--ink);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--emerald);
      }
      .chip[aria-pressed='true'] {
        border-color: var(--emerald-btn);
        background: var(--emerald-soft);
        color: var(--emerald-deep);
      }
      .chip.short[aria-pressed='true'] {
        border-color: var(--rose);
        background: var(--rose-soft);
        color: var(--rose-ink);
      }
      .chip:disabled {
        background: var(--disabled-bg);
        border-color: var(--line);
        color: var(--disabled-ink);
        cursor: not-allowed;
      }
      .preview {
        margin: 0;
        padding: 4px 7px;
        border-radius: 8px;
        background: rgba(47, 58, 52, 0.035);
        font-size: 9.5px;
        color: var(--ink-soft);
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      /* 下单前的强平价（SPEC v10 US7）：和预览句分两行，预览句的措辞是产品硬文案。 */
      .liquidation {
        margin: 0;
        padding: 0 2px;
        font-size: 9.5px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .submit {
        width: 100%;
        padding: 7px 12px;
        border: none;
        border-radius: 10px;
        background: var(--emerald-btn);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .submit:hover:not(:disabled) {
        background: var(--emerald-deep);
      }
      .submit[data-side='short'] {
        background: var(--rose-ink);
      }
      .submit[data-side='short']:hover:not(:disabled) {
        background: #8c2b22;
      }
      .submit:disabled {
        background: var(--disabled-bg);
        border: 1px solid var(--line);
        color: var(--disabled-ink);
        cursor: not-allowed;
      }
      .hint {
        margin: 0;
        font-size: 10px;
        color: var(--amber-ink);
        line-height: 1.4;
      }
      .hint:empty {
        display: none;
      }
      /* ------------------------------ 到价挂单（票 83） ------------------------------ */
      .limit {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .limit-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .limit-toggle {
        flex: none;
      }
      .limit-toggle[aria-pressed='true'] {
        border-color: var(--amber);
        background: var(--amber-soft);
        color: var(--amber-ink);
      }
      .limit-note {
        min-width: 0;
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .limit-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 8px;
        border: 1px dashed var(--line-strong);
        border-radius: 10px;
        background: rgba(231, 162, 58, 0.05);
      }
      .limit-box[hidden] {
        display: none;
      }
      .limit-input-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .limit-input-row .field-label {
        margin: 0;
        flex: none;
      }
      .limit-input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border-radius: 9px;
        border: 1px solid var(--line-strong);
        background: var(--card);
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .limit-input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .limit-place {
        flex: none;
      }
      .limit-band {
        margin: 0;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .limit-hint {
        margin: 0;
        font-size: 10px;
        color: var(--amber-ink);
        line-height: 1.5;
      }
      .limit-hint:empty {
        display: none;
      }
      .orders-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding-top: 3px;
        border-top: 1px dashed var(--line);
        font-size: 9.5px;
        color: var(--muted);
      }
      .orders {
        flex: 0 1 auto;
        max-height: 46px;
        min-height: 0;
      }
      .order-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        font-size: 12px;
      }
      .order-row + .order-row {
        border-top: 1px dashed var(--line);
      }
      .order-row .row-title {
        font-size: 12px;
      }
      .order-row .row-meta {
        font-variant-numeric: tabular-nums;
      }
      .order-cancel {
        flex: none;
      }
      .fine {
        margin: auto 0 0;
        padding-top: 4px;
        border-top: 1px dashed var(--line);
        font-size: 9px;
        color: var(--muted);
        line-height: 1.45;
      }
      /* ------------------------------ 持仓/历史 ------------------------------ */
      .positions-card,
      .history-card {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 7px 9px;
      }
      .positions-card .scroll,
      .history-card .scroll {
        flex: 1;
        min-height: 0;
      }
      .positions-card {
        grid-area: positions;
      }
      .history-card {
        grid-area: history;
      }
      .position {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 5px 8px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #fffefb, #fbf7f0);
      }
      .position + .position {
        margin-top: 4px;
      }
      .position-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .position-title {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .position-meta {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .position-side {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .pnl {
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 52px;
        text-align: right;
      }
      .pnl[data-tone='up'] {
        color: var(--emerald-deep);
      }
      .pnl[data-tone='down'] {
        color: var(--rose-ink);
      }
      .pnl[data-tone='flat'] {
        color: var(--ink-soft);
      }
      .ghost {
        padding: 6px 9px;
        border-radius: 9px;
        border: 1px solid var(--line-strong);
        background: var(--card);
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .ghost:hover:not(:disabled) {
        border-color: var(--rose);
        color: var(--rose-ink);
      }
      .ghost.stop[aria-pressed='true'] {
        border-color: var(--amber);
        background: var(--amber-soft);
        color: var(--amber-ink);
      }
      .ghost:disabled {
        background: var(--disabled-bg);
        color: var(--disabled-ink);
        cursor: not-allowed;
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
        font-size: 11.5px;
      }
      .row + .row {
        border-top: 1px dashed var(--line);
      }
      .row-main {
        min-width: 0;
      }
      .row-title {
        font-weight: 600;
      }
      .row-meta {
        margin-top: 1px;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .empty {
        margin: 2px 0 0;
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.6;
      }
      .empty[hidden] {
        display: none;
      }
      /* ------------------------------ 真人周榜（票 82） ------------------------------ */
      .neighbor-card {
        grid-area: neighbor;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 7px 9px;
      }
      .neighbor-card .scroll {
        flex: 1;
        min-height: 0;
      }
      .sentiment-inline {
        display: flex;
        align-items: baseline;
        gap: 4px;
        margin-left: auto;
        font-size: 9.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .sentiment-value {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .sentiment-value[data-tone='up'] {
        color: var(--emerald-deep);
      }
      .sentiment-value[data-tone='down'] {
        color: var(--rose-ink);
      }
      /* US19：邻居的当前持仓画成小 chip（作物 + 多/空 + 杠杆），摘要仍保留多空计数。 */
      .league-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 3px;
      }
      .league-chip {
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--emerald-soft);
        color: var(--emerald-deep);
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
      }
      .league-chip[data-tone='short'] {
        background: var(--rose-soft);
        color: var(--rose-ink);
      }
      .league-chip.more {
        background: rgba(47, 58, 52, 0.06);
        color: var(--muted);
      }
      /* 本机那一行一直高亮：榜上第一眼要找的是自己的名次，不是邻居。 */
      .league-row.me {
        margin: 0 -6px;
        padding: 4px 6px;
        border-radius: 8px;
        background: var(--emerald-soft);
      }
      .league-row.me + .league-row {
        border-top: none;
      }
      .league-score {
        flex: none;
        text-align: right;
        white-space: nowrap;
      }
      /* 榜行比持仓卡密：分数用 12px，够看清又不把一屏挤成两行。 */
      .league-row .pnl {
        font-size: 12px;
        min-width: 40px;
      }
      .league-pct {
        margin-left: 6px;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .league-pct[data-tone='up'] {
        color: var(--emerald-deep);
      }
      .league-pct[data-tone='down'] {
        color: var(--rose-ink);
      }
      /* ------------------------------ 其他 ------------------------------ */
      .toasts {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(47, 58, 52, 0.92);
        color: #fff;
        font-size: 12px;
        box-shadow: var(--shadow-lift);
        white-space: nowrap;
      }
      .toast.error {
        background: var(--rose-ink);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="drag-grip" aria-hidden="true">⠿</span>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">📈</span>
          <div class="brand-text">
            <h1 id="board-title">盘口</h1>
            <p id="board-subtitle">15 分钟合约 · 收盘自动结算</p>
          </div>
        </div>
        <div class="week" title="本周交易盈亏（已实现 + 未实现）与收益率；周一 00:00 清零，硬币不清零">
          <small>本周</small><b id="week-pnl" data-tone="flat">0.0</b><span id="week-pct">—</span>
        </div>
        <div class="wallet">
          <span class="pill" title="可用硬币 = 农场硬币">
            <small>可用</small><b id="coins-available">0</b>
          </span>
          <span class="pill" title="可用 + 锁定保证金 + 未实现盈亏">
            <small>含锁定</small><b id="coins-total">0</b>
          </span>
        </div>
        <div class="countdown" title="距这一根收盘">
          <b id="countdown">15:00</b>
          <span>距收盘</span>
        </div>
        <button class="close" id="close" type="button" aria-label="关闭盘口">×</button>
      </header>

      <div class="body">
        <section class="card chart-card" aria-label="行情 K 线">
          <div class="chart-head">
            <div class="crop-tabs" id="crop-tabs" role="group" aria-label="作物"></div>
            <div class="timeframe-tabs" id="timeframe-tabs" role="group" aria-label="K 线周期"></div>
            <div class="chart-quote">
              <b class="chart-price" id="chart-price" data-tone="flat">—</b>
              <span class="chart-change" id="chart-change">—</span>
              <span class="wind" id="wind" data-tone="flat">风向 —</span>
            </div>
          </div>
          <svg
            class="chart-svg"
            id="chart"
            viewBox="0 0 720 280"
            preserveAspectRatio="none"
            role="img"
            aria-label="K 线"
          ></svg>
          <p class="chart-empty" id="chart-empty" hidden>行情还在算，稍等一下。</p>
          <div class="chart-foot">
            <span class="legend" id="legend"></span>
            <span class="chart-settle-hint" id="chart-settle-hint" data-visible="false"></span>
            <span class="slot-note" id="slot-note">—</span>
          </div>
        </section>

        <section class="card order-card" aria-labelledby="order-title">
          <div class="card-head">
            <h2 id="order-title">下单</h2>
            <span id="order-crop">小番茄</span>
          </div>
          <div class="order-scroll">
            <div class="field-row">
              <span class="field-label">方向</span>
              <div class="chip-row side-row" id="side-row" role="group" aria-label="方向"></div>
              <span class="field-label">杠杆</span>
              <div class="chip-row leverage-row" id="leverage-row" role="group" aria-label="杠杆"></div>
            </div>
            <div class="field-row">
              <span class="field-label">保证金</span>
              <div class="chip-row" id="margin-row" role="group" aria-label="保证金"></div>
            </div>
            <div class="limit">
              <div class="limit-head">
                <button class="ghost limit-toggle" id="limit-toggle" type="button" aria-pressed="false">
                  到价
                </button>
                <span class="limit-note" id="limit-note">关：直接按现价开仓</span>
              </div>
              <div class="limit-box" id="limit-box" hidden>
                <div class="limit-input-row">
                  <label class="field-label" for="limit-target">目标价</label>
                  <input
                    class="limit-input"
                    id="limit-target"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="5.00"
                    aria-describedby="limit-band limit-hint"
                  />
                  <button class="ghost limit-place" id="limit-place" type="button">挂单</button>
                </div>
                <p class="limit-band" id="limit-band"></p>
                <p class="limit-hint" id="limit-hint"></p>
              </div>
            </div>
            <p class="preview" id="preview"></p>
            <p class="liquidation" id="order-liquidation"></p>
            <div class="orders-head">
              <span>到价挂单</span>
              <span id="orders-meta">挂单 0</span>
            </div>
            <div class="scroll orders" id="orders"></div>
            <p class="empty" id="orders-empty">没有挂单。</p>
            <p class="fine">
              没有手续费、没有资金费、没有风险控制。关掉窗口也会照常收盘结算；硬币赔光就去种地。
            </p>
          </div>
          <div class="order-actions">
            <button class="submit" id="submit" type="button">开一手</button>
            <p class="hint" id="order-hint"></p>
          </div>
        </section>

        <section class="card positions-card" aria-labelledby="positions-title">
          <div class="card-head">
            <h2 id="positions-title">持仓</h2>
            <span id="positions-meta">持仓 0</span>
          </div>
          <div class="scroll" id="positions"></div>
          <p class="empty" id="positions-empty">还没有持仓。</p>
        </section>

        <section class="card history-card" aria-labelledby="history-title">
          <div class="card-head">
            <h2 id="history-title">最近结算</h2>
            <span id="history-meta">0 笔</span>
          </div>
          <div class="scroll" id="history"></div>
          <p class="empty" id="history-empty">还没有结算记录。</p>
        </section>

        <section class="card neighbor-card" aria-labelledby="neighbor-title">
          <div class="card-head">
            <h2 id="neighbor-title">真人周榜</h2>
            <span class="sentiment-inline">
              <span>LAN 情绪</span>
              <b class="sentiment-value" id="sentiment" data-tone="flat">观望</b>
            </span>
            <span id="league-count">1 人</span>
          </div>
          <div class="scroll" id="league"></div>
          <p class="empty" id="neighbor-empty">还没有邻居上线。</p>
        </section>
      </div>

      <div class="toasts" id="toasts"></div>
    </div>
    <script src="trading-view.js"></script>
    <script src="board.js"></script>
  </body>
</html>
