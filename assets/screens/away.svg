255,255,255,0.13)"/><text x="517" y="271.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="rgba(244,248,255,0.9)" text-anchor="middle">邻居</text><rect x="404" y="288" width="226" height="30" rx="8" fill="rgba(255,255,255,0.13)"/><text x="517" y="307.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="rgba(244,248,255,0.9)" text-anchor="middle">带派</text><rect x="404" y="324" width="226" height="30" rx="8" fill="rgba(255,255,255,0.13)"/><text x="517" y="343.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="rgba(244,248,255,0.9)" text-anchor="middle">改名</text><rect x="404" y="360" width="226" height="30" rx="8" fill="rgba(59,116,216,0.94)"/><text x="517" y="379.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#f4f8ff" text-anchor="middle">召回</text><rect x="404" y="396" width="226" height="30" rx="8" fill="rgba(255,255,255,0.13)"/><text x="517" y="415.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="rgba(244,248,255,0.9)" text-anchor="middle">更多</text>
