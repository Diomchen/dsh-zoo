name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and test
        run: |
          set -o pipefail
          npm run check 2>&1 | tee test.log

      # 测试日志要仓库权限才能下载；失败用例名转成注解，匿名也能在 checks 里读到。
      - name: Report failing tests
        if: failure()
        run: |
          grep -E '^(not ok|[[:space:]]*✖ )' test.log | head -20 | while IFS= read -r line; do
            echo "::error title=测试失败::${line}"
          done || true

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          version="${TAG#v}"
          test -f "dist/dsh-zoo-${version}.tgz"
          cp "dist/dsh-zoo-${version}.tgz" dist/dsh-zoo.tgz
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/releases/${version}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "dsh-zoo $TAG" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/*.tgz \
              --verify-tag \
              --title "dsh-zoo $TAG" \
              --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.tgz \
              --verify-tag \
              --title "dsh-zoo $TAG" \
              --generate-notes
          fi

  # Trusted Publishing (OIDC)：npm 包设置里把发布来源指到
  # Diomchen/dsh-zoo 的 .github/workflows/ci.yml，不需要 NPM_TOKEN。
  npm:
    name: Publish npm (OIDC)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ 才支持 Trusted Publishing；Node 24 自带 npm 11。
          node-version: 24

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - name: Publish to npm (OIDC)
        run: |
          set -euo pipefail
          npm --version
          version="$(node -p "require('./package.json').version")"
          # tag 可以重推（Release job 支持覆盖），npm 上已有的版本不能再发一次。
          # 判据用「打印出来的版本号正好等于本地版本」，不看退出码：`npm view`
          # 在版本不存在时会给非零，但空输出 + 0 的情况并不保证不会出现，
          # 那种情况下「靠退出码判断」会把没发的包当成已发而静默跳过。
          # 另外 registry 有索引滞后：v1.9.0 是 11:22 发的，11:26 才查得到
          # （当时被误判成「被跳过」，其实是传播延迟），所以判据只用来跳过，
          # 不承担「确认发布成功」的职责——发布成功看这一步自己的退出码。
          published="$(npm view "dsh-zoo@${version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          echo "::notice::registry 上的 dsh-zoo@${version} = '${published:-<不存在>}'"
          if [ "$published" = "$version" ]; then
            echo "dsh-zoo@${version} 已经在 npm 上了，跳过"
            exit 0
          fi
          # 1.9.0-windows-test.1 这种预发布不能顶掉 latest，走 next。
          dist_tag=latest
          case "$version" in
            *-*) dist_tag=next ;;
          esac
          npm publish --access public --provenance --registry=https://registry.npmjs.org --tag "$dist_tag"
          echo "::notice::已发布 dsh-zoo@${version}（dist-tag ${dist_tag}，OIDC + provenance）"
