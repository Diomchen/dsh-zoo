name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and test
        run: |
          set -o pipefail
          npm run check 2>&1 | tee test.log

      # 测试日志要仓库权限才能下载；失败用例名转成注解，匿名也能在 checks 里读到。
      - name: Report failing tests
        if: failure()
        run: |
          grep -E '^(not ok|[[:space:]]*✖ )' test.log | head -20 | while IFS= read -r line; do
            echo "::error title=测试失败::${line}"
          done || true

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          version="${TAG#v}"
          test -f "dist/dsh-zoo-${version}.tgz"
          cp "dist/dsh-zoo-${version}.tgz" dist/dsh-zoo.tgz
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/releases/${version}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "dsh-zoo $TAG" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/*.tgz \
              --verify-tag \
              --title "dsh-zoo $TAG" \
              --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.tgz \
              --verify-tag \
              --title "dsh-zoo $TAG" \
              --generate-notes
          fi

  npm:
    name: Publish npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN 未设置。本地跑：gh secret set NPM_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          # tag 可以重推（Release job 支持覆盖），npm 上已有的版本不能再发一次。
          if npm view "dsh-zoo@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "dsh-zoo@${version} 已经在 npm 上了，跳过"
            exit 0
          fi
          # 1.9.0-windows-test.1 这种预发布不能顶掉 latest，走 next。
          dist_tag=latest
          case "$version" in
            *-*) dist_tag=next ;;
          esac
          npm whoami
          npm publish --access public --registry=https://registry.npmjs.org --tag "$dist_tag"
