<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>治愈系 24 地块农场 UI 原型</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #F2F7F2;
            color: #2D3B2D;
            user-select: none;
        }

        /* Pulse animations for harvest */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        .harvest-ready {
            animation: gentle-bounce 1.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
            50% { border-color: rgba(245, 158, 11, 0.9); box-shadow: 0 0 18px rgba(245, 158, 11, 0.4); }
        }

        .glow-effect {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Floating action notification */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-35px) scale(1.1); }
        }

        .float-text {
            animation: float-up 1s forwards ease-out;
        }

        /* Smooth scrollbar for grid view */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 sm:p-4 bg-emerald-950/10">

    <!-- App Container -->
    <div class="relative w-full max-w-md md:max-w-4xl h-[92vh] max-h-[900px] bg-[#FAF8F5] rounded-3xl shadow-2xl border-4 border-white/80 overflow-hidden flex flex-col">

        <!-- 1. Header Bar -->
        <header class="px-5 py-3 bg-white/90 backdrop-blur-md border-b border-stone-100 flex items-center justify-between shrink-0 z-20">
            <!-- Left: Avatar & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i data-lucide="sprout" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-stone-800 flex items-center gap-1.5">
                        阳光农场 <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">LV.4</span>
                    </h1>
                    <p class="text-[11px] text-stone-400 font-medium">地块：<span id="planted-count" class="text-emerald-600 font-bold">0</span>/24 已种植</p>
                </div>
            </div>

            <!-- Right: Currency Stats & Exit -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Coins Pill -->
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 rounded-full border border-amber-200/60 shadow-sm">
                    <span class="text-base">🪙</span>
                    <span id="coin-val" class="font-bold text-amber-900 text-xs sm:text-sm">30</span>
                </div>
                <!-- Dew Pill -->
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-sky-50 rounded-full border border-sky-200/60 shadow-sm">
                    <span class="text-base">💧</span>
                    <span id="dew-val" class="font-bold text-sky-900 text-xs sm:text-sm">8</span>
                </div>
                <!-- Close Button -->
                <button class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-500 flex items-center justify-center transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- 2. Navigation & Quick Actions Bar -->
        <div class="px-5 py-2.5 bg-stone-50/70 border-b border-stone-100 flex items-center justify-between shrink-0 gap-2 z-10">
            <!-- Tabs -->
            <nav class="flex gap-1 bg-stone-200/50 p-1 rounded-2xl text-xs font-bold text-stone-600">
                <button class="px-3 py-1.5 rounded-xl bg-white text-emerald-800 shadow-sm transition-all">🌾 农场</button>
                <button class="px-3 py-1.5 rounded-xl hover:text-stone-900 transition-all opacity-60">🔄 交易所</button>
                <button class="px-3 py-1.5 rounded-xl hover:text-stone-900 transition-all opacity-60">👷 雇工</button>
                <button class="px-3 py-1.5 rounded-xl hover:text-stone-900 transition-all opacity-60">📜 记录</button>
            </nav>

            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-2">
                <button onclick="batchPlantFirstAvailable()" class="flex items-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20 transition-all">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 一键播种
                </button>
                <button id="batch-harvest-btn" class="flex items-center gap-1 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md shadow-amber-500/20 transition-all">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 一键收割
                </button>
            </div>
        </div>

        <!-- Floating Notification Container -->
        <div id="toast-container" class="absolute top-20 left-1/2 -translate-x-1/2 pointer-events-none z-50 flex flex-col items-center"></div>

        <!-- 3. Main 2D Grid Playfield (24 Pure 2D Flat Lands) -->
        <main class="flex-1 relative overflow-y-auto custom-scroll bg-gradient-to-b from-[#FAF8F5] via-[#F5F2EC] to-[#EFEBE4] p-3 sm:p-5">
            <div id="compact-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5 sm:gap-3.5 pb-16">
                <!-- 24 Pure 2D Cards Dynamic Generation -->
            </div>
        </main>

        <!-- 4. Bottom Inventory & Warehouse Drawer -->
        <footer class="bg-white/95 backdrop-blur-md border-t border-stone-200/70 p-3.5 sm:p-4 shrink-0 shadow-lg z-20">
            <div class="flex flex-col gap-2.5">
                
                <!-- Inventory Category 1: Seeds Bag -->
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center gap-1.5 font-bold text-stone-700">
                        <span class="p-1 rounded-md bg-emerald-100 text-emerald-700"><i data-lucide="package" class="w-3.5 h-3.5"></i></span>
                        种子背包
                    </div>
                    <div class="flex items-center gap-2 overflow-x-auto py-0.5">
                        <div class="flex items-center gap-1.5 px-2.5 py-1 bg-stone-100 rounded-full border border-stone-200 shrink-0">
                            <span class="text-sm">🍅</span>
                            <span class="text-stone-600 font-medium">小番茄</span>
                            <span id="seed-count-tomato" class="font-extrabold text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded-full text-[10px]">2</span>
                        </div>
                        <div class="flex items-center gap-1.5 px-2.5 py-1 bg-stone-100 rounded-full border border-stone-200 shrink-0">
                            <span class="text-sm">🥕</span>
                            <span class="text-stone-600 font-medium">胡萝卜</span>
                            <span id="seed-count-carrot" class="font-extrabold text-stone-500 bg-stone-200 px-1.5 py-0.2 rounded-full text-[10px]">1</span>
                        </div>
                        <div class="flex items-center gap-1.5 px-2.5 py-1 bg-stone-100 rounded-full border border-stone-200 shrink-0">
                            <span class="text-sm">🎃</span>
                            <span class="text-stone-600 font-medium">南瓜</span>
                            <span id="seed-count-pumpkin" class="font-extrabold text-stone-500 bg-stone-200 px-1.5 py-0.2 rounded-full text-[10px]">1</span>
                        </div>
                    </div>
                </div>

                <div class="h-px bg-stone-100 w-full"></div>

                <!-- Inventory Category 2: Crops Warehouse -->
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center gap-1.5 font-bold text-stone-700">
                        <span class="p-1 rounded-md bg-amber-100 text-amber-700"><i data-lucide="archive" class="w-3.5 h-3.5"></i></span>
                        收获仓库
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <div class="flex items-center gap-1 px-2.5 py-1 bg-amber-50/50 rounded-full border border-amber-100">
                            <span class="text-sm">🍅</span>
                            <span id="crop-count-tomato" class="font-extrabold text-amber-900">0</span>
                        </div>
                        <div class="flex items-center gap-1 px-2.5 py-1 bg-amber-50/50 rounded-full border border-amber-100">
                            <span class="text-sm">🥕</span>
                            <span id="crop-count-carrot" class="font-extrabold text-amber-900">0</span>
                        </div>
                        <div class="flex items-center gap-1 px-2.5 py-1 bg-amber-50/50 rounded-full border border-amber-100">
                            <span class="text-sm">🎃</span>
                            <span id="crop-count-pumpkin" class="font-extrabold text-amber-900">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </footer>

        <!-- 5. Planting Dialog Drawer Modal -->
        <div id="plant-modal" class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm z-40 hidden flex items-end sm:items-center justify-center p-4 transition-all">
            <div class="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl border border-stone-100 transform transition-all animate-in slide-in-from-bottom duration-200">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="font-extrabold text-base text-stone-800">播种地块 #<span id="modal-plot-id">1</span></h3>
                        <p class="text-xs text-stone-400">选择您要种植的种子</p>
                    </div>
                    <button onclick="closePlantModal()" class="w-7 h-7 bg-stone-100 rounded-full text-stone-400 hover:text-stone-700 flex items-center justify-center">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Seed Options List -->
                <div class="space-y-2.5 mb-4">
                    <div onclick="confirmPlant('tomato')" class="group p-3 rounded-2xl border-2 border-stone-100 hover:border-emerald-500 bg-stone-50/50 hover:bg-emerald-50/30 flex items-center justify-between cursor-pointer transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-red-100 text-2xl flex items-center justify-center group-hover:scale-110 transition-transform">🍅</div>
                            <div>
                                <div class="font-bold text-sm text-stone-800">小番茄</div>
                                <div class="text-[11px] text-stone-400">成熟需 5秒 · 收益 +10 币</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span id="modal-seed-tomato" class="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-extrabold rounded-lg text-xs">拥有 x2</span>
                        </div>
                    </div>

                    <div onclick="confirmPlant('carrot')" class="group p-3 rounded-2xl border-2 border-stone-100 hover:border-emerald-500 bg-stone-50/50 hover:bg-emerald-50/30 flex items-center justify-between cursor-pointer transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-orange-100 text-2xl flex items-center justify-center group-hover:scale-110 transition-transform">🥕</div>
                            <div>
                                <div class="font-bold text-sm text-stone-800">胡萝卜</div>
                                <div class="text-[11px] text-stone-400">成熟需 10秒 · 收益 +25 币</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span id="modal-seed-carrot" class="px-2.5 py-1 bg-stone-100 text-stone-400 font-extrabold rounded-lg text-xs">拥有 x1</span>
                        </div>
                    </div>

                    <div onclick="confirmPlant('pumpkin')" class="group p-3 rounded-2xl border-2 border-stone-100 hover:border-emerald-500 bg-stone-50/50 hover:bg-emerald-50/30 flex items-center justify-between cursor-pointer transition-all">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-100 text-2xl flex items-center justify-center group-hover:scale-110 transition-transform">🎃</div>
                            <div>
                                <div class="font-bold text-sm text-stone-800">南瓜</div>
                                <div class="text-[11px] text-stone-400">成熟需 20秒 · 收益 +60 币</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span id="modal-seed-pumpkin" class="px-2.5 py-1 bg-stone-100 text-stone-400 font-extrabold rounded-lg text-xs">拥有 x1</span>
                        </div>
                    </div>
                </div>

                <!-- Buy Seed Quick Action -->
                <button onclick="buyRandomSeed()" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-500/20 active:scale-98 transition-all flex items-center justify-center gap-1.5">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i> 购买随机种子 (消耗 🪙5)
                </button>
            </div>
        </div>

    </div>

    <!-- Application Game Logic Script -->
    <script>
        const CROPS = {
            tomato: { name: '小番茄', icon: '🍅', sprout: '🌱', growthTime: 5, rewardCoin: 10 },
            carrot: { name: '胡萝卜', icon: '🥕', sprout: '🌱', growthTime: 10, rewardCoin: 25 },
            pumpkin: { name: '南瓜', icon: '🎃', sprout: '🌱', growthTime: 20, rewardCoin: 60 }
        };

        let userState = {
            coins: 30,
            dew: 8,
            seeds: { tomato: 2, carrot: 1, pumpkin: 1 },
            crops: { tomato: 0, carrot: 0, pumpkin: 0 }
        };

        let plots = Array.from({ length: 24 }, (_, i) => ({
            id: i + 1,
            status: 'empty',
            cropType: null,
            timer: 0,
            maxTime: 0,
            intervalId: null
        }));

        let activeTargetPlotId = null;

        // Pre-plant 2 lands for immediate playability demo
        plots[0] = { id: 1, status: 'ready', cropType: 'tomato', timer: 0, maxTime: 5, intervalId: null };
        plots[1] = { id: 2, status: 'growing', cropType: 'carrot', timer: 5, maxTime: 10, intervalId: null };

        window.onload = () => {
            lucide.createIcons();
            renderGridView();
            updateUIStats();
            startTimerForGrowingPlots();

            document.getElementById('batch-harvest-btn').addEventListener('click', batchHarvest);
        };

        function startTimerForGrowingPlots() {
            plots.forEach(plot => {
                if (plot.status === 'growing') {
                    runGrowthTimer(plot);
                }
            });
        }

        // Render Pure 2D Grid Cards View
        function renderGridView() {
            const container = document.getElementById('compact-grid');
            container.innerHTML = '';

            plots.forEach(plot => {
                const card = document.createElement('div');
                card.className = `relative p-2.5 rounded-2xl border-2 flex flex-col items-center justify-between cursor-pointer transition-all h-24 sm:h-28 ${getGridCardStyle(plot)}`;
                card.onclick = () => handlePlotClick(plot.id);

                let bodyHtml = '';
                if (plot.status === 'empty') {
                    bodyHtml = `
                        <div class="text-[10px] sm:text-xs text-stone-400 font-bold w-full text-left">#${plot.id}</div>
                        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm sm:text-base font-extrabold group-hover:scale-110 transition-transform">+</div>
                        <div class="text-[10px] text-stone-400 font-semibold">种植</div>
                    `;
                } else if (plot.status === 'growing') {
                    const percent = Math.floor(((plot.maxTime - plot.timer) / plot.maxTime) * 100);
                    bodyHtml = `
                        <div class="flex justify-between w-full text-[10px] text-stone-500 font-bold">
                            <span>#${plot.id}</span>
                            <span class="text-emerald-600 font-extrabold">${plot.timer}s</span>
                        </div>
                        <div class="text-lg sm:text-xl my-0.5">${CROPS[plot.cropType].sprout}</div>
                        <div class="w-full bg-stone-200/80 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all duration-1000" style="width:${percent}%"></div>
                        </div>
                    `;
                } else if (plot.status === 'ready') {
                    bodyHtml = `
                        <div class="text-[10px] font-bold text-amber-700 w-full flex justify-between">
                            <span>#${plot.id}</span>
                            <span>✨可收割</span>
                        </div>
                        <div class="harvest-ready text-2xl sm:text-3xl my-0.5 filter drop-shadow-sm">${CROPS[plot.cropType].icon}</div>
                        <div class="text-[9px] sm:text-[10px] font-extrabold text-white bg-gradient-to-r from-amber-500 to-orange-500 px-2 py-0.5 rounded-full shadow-sm">点击收割</div>
                    `;
                }

                card.innerHTML = bodyHtml;
                container.appendChild(card);
            });

            updatePlantedCount();
        }

        function getGridCardStyle(plot) {
            if (plot.status === 'empty') return 'bg-white border-stone-200/80 hover:border-emerald-400 shadow-sm group';
            if (plot.status === 'growing') return 'bg-emerald-50/40 border-emerald-200/90 shadow-sm';
            return 'bg-amber-50 border-amber-300 shadow-md glow-effect';
        }

        function handlePlotClick(plotId) {
            const plot = plots.find(p => p.id === plotId);
            if (!plot) return;

            if (plot.status === 'empty') {
                openPlantModal(plotId);
            } else if (plot.status === 'ready') {
                harvestPlot(plot);
            } else if (plot.status === 'growing') {
                showToast(`地块 #${plot.id} 生长中，还剩 ${plot.timer} 秒`, 'info');
            }
        }

        function openPlantModal(plotId) {
            activeTargetPlotId = plotId;
            document.getElementById('modal-plot-id').innerText = plotId;
            
            document.getElementById('modal-seed-tomato').innerText = `拥有 x${userState.seeds.tomato}`;
            document.getElementById('modal-seed-carrot').innerText = `拥有 x${userState.seeds.carrot}`;
            document.getElementById('modal-seed-pumpkin').innerText = `拥有 x${userState.seeds.pumpkin}`;

            document.getElementById('plant-modal').classList.remove('hidden');
        }

        function closePlantModal() {
            document.getElementById('plant-modal').classList.add('hidden');
            activeTargetPlotId = null;
        }

        function confirmPlant(cropType) {
            if (userState.seeds[cropType] <= 0) {
                showToast(`您的 ${CROPS[cropType].name} 种子不足！`, 'error');
                return;
            }

            const plot = plots.find(p => p.id === activeTargetPlotId);
            if (!plot) return;

            userState.seeds[cropType]--;
            plot.status = 'growing';
            plot.cropType = cropType;
            plot.maxTime = CROPS[cropType].growthTime;
            plot.timer = CROPS[cropType].growthTime;

            closePlantModal();
            updateUIStats();
            renderGridView();
            runGrowthTimer(plot);

            showToast(`成功在 #${plot.id} 地块种下 ${CROPS[cropType].name}`, 'success');
        }

        function batchPlantFirstAvailable() {
            const emptyPlots = plots.filter(p => p.status === 'empty');
            if (emptyPlots.length === 0) {
                showToast('当前没有空闲地块啦！', 'info');
                return;
            }

            const seedTypes = ['tomato', 'carrot', 'pumpkin'];
            let availableSeed = seedTypes.find(type => userState.seeds[type] > 0);

            if (!availableSeed) {
                showToast('背包里没有种子啦，请先购买！', 'error');
                return;
            }

            const targetPlot = emptyPlots[0];
            userState.seeds[availableSeed]--;
            targetPlot.status = 'growing';
            targetPlot.cropType = availableSeed;
            targetPlot.maxTime = CROPS[availableSeed].growthTime;
            targetPlot.timer = CROPS[availableSeed].growthTime;

            updateUIStats();
            renderGridView();
            runGrowthTimer(targetPlot);
            showToast(`一键播种：在 #${targetPlot.id} 地块种下 ${CROPS[availableSeed].name}`, 'success');
        }

        function runGrowthTimer(plot) {
            if (plot.intervalId) clearInterval(plot.intervalId);

            plot.intervalId = setInterval(() => {
                plot.timer--;
                if (plot.timer <= 0) {
                    clearInterval(plot.intervalId);
                    plot.status = 'ready';
                    renderGridView();
                    showToast(`地块 #${plot.id} 的 ${CROPS[plot.cropType].name} 已成熟！`, 'success');
                } else {
                    renderGridView();
                }
            }, 1000);
        }

        function harvestPlot(plot) {
            const cropInfo = CROPS[plot.cropType];
            
            userState.crops[plot.cropType]++;
            userState.coins += cropInfo.rewardCoin;

            plot.status = 'empty';
            plot.cropType = null;
            plot.timer = 0;
            if (plot.intervalId) clearInterval(plot.intervalId);

            updateUIStats();
            renderGridView();
            showToast(`收割成功！获取 ${cropInfo.icon} x1 ，硬币 +${cropInfo.rewardCoin}`, 'reward');
        }

        function batchHarvest() {
            const readyPlots = plots.filter(p => p.status === 'ready');
            if (readyPlots.length === 0) {
                showToast('当前没有已成熟的作物可收割哦！', 'info');
                return;
            }

            let totalCoins = 0;
            readyPlots.forEach(plot => {
                const cropInfo = CROPS[plot.cropType];
                userState.crops[plot.cropType]++;
                totalCoins += cropInfo.rewardCoin;
                plot.status = 'empty';
                plot.cropType = null;
                if (plot.intervalId) clearInterval(plot.intervalId);
            });

            userState.coins += totalCoins;
            updateUIStats();
            renderGridView();
            showToast(`一键收割完成！共收获 ${readyPlots.length} 块土地，获得 🪙${totalCoins}`, 'reward');
        }

        function buyRandomSeed() {
            if (userState.coins < 5) {
                showToast('硬币不足，无法购买种子！', 'error');
                return;
            }

            userState.coins -= 5;
            const seedKeys = ['tomato', 'carrot', 'pumpkin'];
            const randomSeed = seedKeys[Math.floor(Math.random() * seedKeys.length)];
            userState.seeds[randomSeed]++;

            updateUIStats();
            openPlantModal(activeTargetPlotId);
            showToast(`花费 🪙5 购买获得了 1 个 ${CROPS[randomSeed].name} 种子`, 'success');
        }

        function updateUIStats() {
            document.getElementById('coin-val').innerText = userState.coins;
            document.getElementById('dew-val').innerText = userState.dew;

            document.getElementById('seed-count-tomato').innerText = userState.seeds.tomato;
            document.getElementById('seed-count-carrot').innerText = userState.seeds.carrot;
            document.getElementById('seed-count-pumpkin').innerText = userState.seeds.pumpkin;

            document.getElementById('crop-count-tomato').innerText = userState.crops.tomato;
            document.getElementById('crop-count-carrot').innerText = userState.crops.carrot;
            document.getElementById('crop-count-pumpkin').innerText = userState.crops.pumpkin;
        }

        function updatePlantedCount() {
            const planted = plots.filter(p => p.status !== 'empty').length;
            document.getElementById('planted-count').innerText = planted;
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgStyle = 'bg-stone-800 text-white';
            if (type === 'success') bgStyle = 'bg-emerald-600 text-white';
            if (type === 'reward') bgStyle = 'bg-amber-500 text-white font-extrabold';
            if (type === 'error') bgStyle = 'bg-rose-600 text-white';

            toast.className = `float-text px-4 py-2 rounded-2xl shadow-xl text-xs font-bold ${bgStyle} flex items-center gap-1.5 pointer-events-none mb-1`;
            toast.innerHTML = msg;

            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 1200);
        }
    </script>
</body>
</html>
